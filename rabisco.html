<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corre, Rabisco!</title>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f7f3e8}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, S, GY, DPR;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = H / 800; GY = H * 0.8;
}
addEventListener('resize', resize); resize();

const INK = '#1d1d3a', FONT = "'Gochi Hand','Comic Sans MS',cursive";
const SKIN = '#ffdcbc', SHIRT = '#ff8a3d', PANTS = '#3d7bff', HAIR = '#6b3e1f';

// ---------- "boiling" pen wobble ----------
let boil = 0, wc = 0;
function hash(n) { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); }
function w(a = 1.5) { wc++; return (hash(wc * 13.7 + boil * 71.3) - 0.5) * 2 * a; }
function pen(lw, col = INK) { ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function ell(x, y, rx, ry, fill, lw, j = 1.2) {
  ctx.beginPath(); ctx.ellipse(x + w(j), y + w(j), rx, ry, w(0.08), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw) { pen(lw); ctx.stroke(); }
}
function capsule(x1, y1, x2, y2, thick, col, lw) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = INK; ctx.lineWidth = thick + lw * 2;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = thick;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

// ---------- Hero (from the student's drawing) ----------
function drawHero(x, y, t, mode, squash = 0, rot = 0, blink = false) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const k = H / 1000; ctx.scale(k * (1 + squash), k * (1 - squash));
  const lw = 4.5;
  const sw = mode === 'run' ? Math.sin(t * 15) : (mode === 'idle' ? Math.sin(t * 3) * 0.15 : 0);
  // legs
  const legs = mode === 'air' ? [0.55, -0.35] : mode === 'hit' ? [0.9, -0.9] : [sw * 0.7, -sw * 0.7];
  [-10, 10].forEach((hx, i) => {
    const a = legs[i], L = 50;
    const fx = hx + Math.sin(a) * L, fy = -62 + Math.cos(a) * L;
    capsule(hx, -62, fx, fy, 20, PANTS, lw);
    ell(fx + 5, fy + 2, 15, 8, '#fff', lw, 0.6);
  });
  // torso
  ctx.save(); ctx.translate(w(0.8), w(0.8));
  ctx.beginPath(); ctx.roundRect(-26, -114, 52, 58, 10);
  ctx.fillStyle = SHIRT; ctx.fill(); pen(lw); ctx.stroke();
  pen(5); ctx.beginPath(); ctx.moveTo(-24, -60); ctx.lineTo(24, -60); ctx.stroke();
  pen(3); ctx.beginPath(); ctx.moveTo(-25, -92); ctx.lineTo(-14, -92); ctx.moveTo(25, -92); ctx.lineTo(14, -92); ctx.stroke();
  ctx.restore();
  // arms
  const arms = mode === 'air' ? [-2.4, 2.4] : mode === 'hit' ? [-2.8, 2.8] : [-sw * 0.7 - 0.15, -sw * 0.7 + 0.15];
  [-26, 26].forEach((sx, i) => {
    const a = arms[i], L = 46;
    const hx = sx + Math.sin(a) * L * (i ? 1 : 1), hy = -104 + Math.cos(a) * L;
    capsule(sx, -104, sx + Math.sin(a) * 16, -104 + Math.cos(a) * 16, 17, SHIRT, lw);
    capsule(sx + Math.sin(a) * 16, -104 + Math.cos(a) * 16, hx, hy, 12, SKIN, lw);
    ell(hx, hy, 9, 8, SKIN, lw, 0.5);
    pen(3); ctx.beginPath();
    for (let f = -1; f <= 1; f++) { ctx.moveTo(hx + f * 5, hy + 5); ctx.lineTo(hx + f * 6, hy + 11); }
    ctx.stroke();
  });
  // ear + head
  ell(38, -160, 9, 12, SKIN, lw, 0.6);
  ell(0, -162, 40, 46, SKIN, lw, 0.8);
  // hair (spiky)
  ctx.save(); ctx.translate(w(1), w(1));
  ctx.beginPath(); ctx.moveTo(-42, -166);
  const spikes = [[-46, -200], [-30, -192], [-28, -222], [-14, -202], [-4, -228], [8, -204], [20, -226], [28, -200], [44, -214], [42, -186], [48, -170]];
  spikes.forEach(p => ctx.lineTo(p[0], p[1]));
  ctx.lineTo(40, -150); ctx.lineTo(36, -170);
  for (let i = 0; i <= 8; i++) ctx.lineTo(34 - i * 9.5, -178 + (i % 2 ? 7 : -3));
  ctx.closePath(); ctx.fillStyle = HAIR; ctx.fill(); pen(lw); ctx.stroke();
  ctx.restore();
  // eyes
  if (mode === 'hit') {
    pen(4); ctx.beginPath();
    [[-15, -160], [15, -160]].forEach(([ex, ey]) => { ctx.moveTo(ex - 7, ey - 7); ctx.lineTo(ex + 7, ey + 7); ctx.moveTo(ex + 7, ey - 7); ctx.lineTo(ex - 7, ey + 7); });
    ctx.stroke();
  } else {
    [[-15, -160], [15, -160]].forEach(([ex, ey]) => {
      pen(3); ctx.beginPath(); ctx.ellipse(ex + 1, ey + 2, 15, 17, 0, 0.6, 2.6); ctx.stroke();
      if (blink) { pen(4); ctx.beginPath(); ctx.moveTo(ex - 8, ey); ctx.lineTo(ex + 8, ey); ctx.stroke(); }
      else { ell(ex, ey, 9, 12, '#fff', 3.5, 0.4); ell(ex + 3, ey + 1, 4, 6, INK, 0, 0.2); }
    });
  }
  // nose, mouth, cheeks
  pen(3.5); ctx.beginPath(); ctx.arc(4, -142, 6, Math.PI * 0.5, Math.PI * 1.5, false); ctx.stroke();
  ctx.fillStyle = 'rgba(255,110,130,.35)';
  ctx.beginPath(); ctx.arc(-24, -138, 7, 0, 7); ctx.arc(26, -138, 7, 0, 7); ctx.fill();
  pen(4); ctx.beginPath();
  if (mode === 'hit') ctx.ellipse(2, -126, 6, 8, 0, 0, 7);
  else if (mode === 'air') { ctx.arc(2, -132, 10, 0.1 * Math.PI, 0.9 * Math.PI); ctx.closePath(); }
  else ctx.arc(2, -132, 9, 0.2 * Math.PI, 0.8 * Math.PI);
  ctx.stroke();
  ctx.restore();
}

// ---------- Audio ----------
let AC = null;
function beep(f1, f2, dur, type = 'square', vol = 0.12) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}

// ---------- Game state ----------
let state = 'menu', time = 0, best = 0;
try { best = +localStorage.getItem('rabiscoBest') || 0; } catch (e) {}
let hero, obs, items, parts, floats, speed, dist, score, nextObs, nextItem, shake, overT, level, banner;
function reset() {
  hero = { x: 0, y: 0, vy: 0, jumps: 0, squash: 0, rot: 0 };
  obs = []; items = []; parts = []; floats = [];
  speed = 430; dist = 0; score = 0; nextObs = 700; nextItem = 400; shake = 0; level = 1; banner = { txt: 'VAI!', t: 1.2 };
}
reset();

function jump() {
  if (state === 'menu') { state = 'play'; reset(); beep(400, 800, 0.15); return; }
  if (state === 'over') { if (overT > 0.6) { state = 'play'; reset(); beep(400, 800, 0.15); } return; }
  if (hero.jumps < 2) {
    hero.vy = hero.jumps === 0 ? -930 : -820; hero.jumps++;
    hero.squash = -0.15;
    beep(hero.jumps === 1 ? 320 : 480, hero.jumps === 1 ? 640 : 960, 0.14, 'triangle', 0.15);
    for (let i = 0; i < 6; i++) parts.push({ x: heroX(), y: GY + hero.y * S, vx: (Math.random() - 0.5) * 200, vy: -Math.random() * 120, life: 0.5, r: 4 + Math.random() * 5, col: '#999' });
  }
}
addEventListener('keydown', e => { if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) { e.preventDefault(); if (!e.repeat) jump(); } });
cv.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });

const heroX = () => W * 0.22;
const TYPES = {
  borracha: { w: 74, h: 44, y: 0 },
  tinta:    { w: 66, h: 34, y: 0 },
  lapis:    { w: 28, h: 100, y: 0 },
  aviao:    { w: 80, h: 34, y: 390 },
};
function spawnObs() {
  const r = Math.random();
  let pool = ['borracha', 'tinta'];
  if (level >= 2) pool.push('lapis', 'lapis');
  if (level >= 3) pool.push('aviao');
  const t = pool[Math.floor(Math.random() * pool.length)];
  obs.push({ type: t, x: W / S + 100, wob: Math.random() * 6 });
  if (t !== 'aviao' && level >= 3 && r < 0.25) obs.push({ type: 'borracha', x: W / S + 100 + 80, wob: 1 });
  const gapSec = Math.max(0.75, 1.5 - level * 0.08) + Math.random() * 0.9;
  nextObs = speed * gapSec;
}
function spawnItems() {
  const n = 3 + Math.floor(Math.random() * 4), hgt = [40, 120, 200][Math.floor(Math.random() * 3)];
  const ap = Math.random() < 0.12;
  for (let i = 0; i < n; i++) items.push({ x: W / S + 100 + i * 60, y: hgt + Math.sin(i * 0.9) * 25, ap: ap && i === n - 1, got: false });
  nextItem = 600 + Math.random() * 700;
}

// ---------- Drawing world ----------
let scrollX = 0;
function drawPaper() {
  ctx.fillStyle = '#fbf8ef'; ctx.fillRect(0, 0, W, H);
  const sp = 36 * S;
  ctx.strokeStyle = 'rgba(80,130,200,.28)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let y = sp * 2.5; y < H; y += sp) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  // red margin lines scrolling
  const m = 900 * S, off = (scrollX * 0.5 * S) % m;
  ctx.strokeStyle = 'rgba(230,70,90,.35)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = -off + 60 * S; x < W + m; x += m) { ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.moveTo(x + 6 * S, 0); ctx.lineTo(x + 6 * S, H); }
  ctx.stroke();
}
function doodle(kind, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); pen(2.5, 'rgba(60,60,90,.35)');
  ctx.beginPath();
  if (kind === 0) { // cloud
    ctx.arc(0, 0, 26, Math.PI, 0); ctx.arc(40, -10, 32, Math.PI, 0); ctx.arc(80, 0, 24, Math.PI, 0); ctx.lineTo(-26, 0);
  } else if (kind === 1) { // sun
    ctx.arc(0, 0, 30, 0, 7);
    for (let i = 0; i < 10; i++) { const a = i / 10 * 7 + time * 0.3; ctx.moveTo(Math.cos(a) * 40, Math.sin(a) * 40); ctx.lineTo(Math.cos(a) * 55, Math.sin(a) * 55); }
  } else if (kind === 2) { // house
    ctx.rect(-40, -60, 80, 60); ctx.moveTo(-50, -60); ctx.lineTo(0, -105); ctx.lineTo(50, -60); ctx.rect(-12, -32, 22, 32); ctx.rect(15, -50, 18, 16);
  } else if (kind === 3) { // tree
    ctx.moveTo(-6, 0); ctx.lineTo(-6, -50); ctx.moveTo(6, 0); ctx.lineTo(6, -50);
    ctx.arc(0, -80, 34, 0, 7);
  } else { // bird
    ctx.moveTo(-14, 0); ctx.quadraticCurveTo(-7, -10, 0, 0); ctx.quadraticCurveTo(7, -10, 14, 0);
  }
  ctx.stroke(); ctx.restore();
}
function drawBackground() {
  // far doodles (parallax)
  const p = scrollX * 0.25 * S, span = 1400 * S;
  const layout = [[1, 150, 130, 1], [0, 420, 170, 1.1], [4, 600, 120, 1], [0, 900, 110, 0.9], [4, 1150, 190, 0.9], [0, 1250, 150, 1]];
  layout.forEach(([k, lx, ly, sc]) => {
    let x = ((lx * S - p) % span + span) % span - 100 * S;
    doodle(k, x, ly * S, sc * S);
  });
  const p2 = scrollX * 0.55 * S, span2 = 1100 * S;
  [[2, 200, 1], [3, 520, 1.1], [3, 640, 0.8], [2, 900, 0.9]].forEach(([k, lx, sc]) => {
    let x = ((lx * S - p2) % span2 + span2) % span2 - 100 * S;
    doodle(k, x, GY - 2, sc * S);
  });
}
function drawGround() {
  ctx.fillStyle = 'rgba(255,240,180,.55)'; ctx.fillRect(0, GY, W, H - GY);
  pen(5 * S);
  ctx.beginPath(); ctx.moveTo(0, GY + w(1));
  for (let x = 0; x <= W; x += 40) ctx.lineTo(x, GY + w(1.2));
  ctx.stroke();
  // hatching & grass scribbles
  const step = 46 * S, off = (scrollX * S) % step;
  pen(2 * S, 'rgba(60,60,90,.4)'); ctx.beginPath();
  for (let x = -off; x < W + step; x += step) {
    ctx.moveTo(x, GY + 18 * S); ctx.lineTo(x + 16 * S, GY + 34 * S);
    ctx.moveTo(x + 22 * S, GY + 60 * S); ctx.lineTo(x + 36 * S, GY + 74 * S);
  }
  ctx.stroke();
  pen(2.5 * S, '#3a9d4a'); ctx.beginPath();
  const gs = 130 * S, goff = (scrollX * S) % gs;
  for (let x = -goff; x < W + gs; x += gs) {
    ctx.moveTo(x, GY); ctx.lineTo(x + 4 * S, GY - 14 * S); ctx.lineTo(x + 8 * S, GY);
    ctx.lineTo(x + 13 * S, GY - 10 * S); ctx.lineTo(x + 17 * S, GY);
  }
  ctx.stroke();
}
function drawObs(o) {
  const T = TYPES[o.type], x = o.x * S, y = GY - T.y * S;
  ctx.save(); ctx.translate(x, y); ctx.scale(S, S);
  const lw = 4;
  if (o.type === 'borracha') {
    ctx.rotate(-0.06);
    ctx.beginPath(); ctx.roundRect(-37 + w(0.8), -44, 74, 44, 8); ctx.fillStyle = '#ff9db5'; ctx.fill(); pen(lw); ctx.stroke();
    ctx.beginPath(); ctx.rect(-10, -44, 26, 44); ctx.fillStyle = '#4fa3ff'; ctx.fill(); pen(lw); ctx.stroke();
    ell(-22, -30, 3, 3, INK, 0, 0.3); ell(-8, -30, 3, 3, INK, 0, 0.3);
    pen(3); ctx.beginPath(); ctx.moveTo(-26, -18); ctx.lineTo(-4, -18); ctx.stroke(); // angry eraser face
    pen(3); ctx.beginPath(); ctx.moveTo(-28, -38); ctx.lineTo(-18, -35); ctx.moveTo(-2, -38); ctx.lineTo(-12, -35); ctx.stroke();
  } else if (o.type === 'tinta') {
    ctx.beginPath();
    for (let i = 0; i <= 14; i++) {
      const a = Math.PI + i / 14 * Math.PI, r = 30 + Math.sin(i * 2.3 + o.wob) * 7 + w(1);
      ctx.lineTo(Math.cos(a) * r * 1.1, Math.sin(a) * r * 1.1);
    }
    ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
    ell(-12, -16, 6, 8, '#fff', 0, 0.4); ell(10, -16, 6, 8, '#fff', 0, 0.4);
    ell(-11, -14, 3, 4, INK, 0, 0.3); ell(11, -14, 3, 4, INK, 0, 0.3);
    ell(42, -6, 6, 6, INK, 0, 0.5); ell(-44, -10, 4, 4, INK, 0, 0.5);
  } else if (o.type === 'lapis') {
    ctx.translate(w(0.6), 0);
    ctx.beginPath(); ctx.rect(-14, -78, 28, 66); ctx.fillStyle = '#ffd23f'; ctx.fill(); pen(lw); ctx.stroke();
    ctx.beginPath(); ctx.rect(-14, -12, 28, 12); ctx.fillStyle = '#ff7a9c'; ctx.fill(); pen(lw); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-14, -78); ctx.lineTo(0, -102); ctx.lineTo(14, -78); ctx.closePath(); ctx.fillStyle = '#f3d2a2'; ctx.fill(); pen(lw); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-5, -94); ctx.lineTo(0, -102); ctx.lineTo(5, -94); ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
    pen(2); ctx.beginPath(); ctx.moveTo(-4, -74); ctx.lineTo(-4, -16); ctx.moveTo(5, -74); ctx.lineTo(5, -16); ctx.stroke();
  } else if (o.type === 'aviao') {
    const bob = Math.sin(time * 6 + o.wob) * 6; ctx.translate(0, bob - 17);
    ctx.beginPath(); ctx.moveTo(-40, -8); ctx.lineTo(40, 0); ctx.lineTo(-40, 14); ctx.lineTo(-24, 2); ctx.closePath();
    ctx.fillStyle = '#fff'; ctx.fill(); pen(lw); ctx.stroke();
    pen(3); ctx.beginPath(); ctx.moveTo(-24, 2); ctx.lineTo(40, 0); ctx.stroke();
    pen(2, 'rgba(60,60,90,.5)'); ctx.beginPath(); ctx.moveTo(-52, -4); ctx.lineTo(-70, -4); ctx.moveTo(-50, 8); ctx.lineTo(-64, 8); ctx.stroke();
  }
  ctx.restore();
}
function drawStar(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(Math.cos(a) * rr + w(0.6), Math.sin(a) * rr + w(0.6)); }
  ctx.closePath(); ctx.fillStyle = '#ffd23f'; ctx.fill(); pen(3 * S); ctx.stroke();
  ctx.restore();
}
function drawItem(it) {
  const x = it.x * S, y = GY - it.y * S + Math.sin(time * 5 + it.x) * 5 * S;
  if (it.ap) {
    ctx.save(); ctx.translate(x, y);
    ell(0, 0, 30 * S, 30 * S, '#fff', 3.5 * S, 0.6);
    ctx.font = `${34 * S}px ${FONT}`; ctx.fillStyle = '#e23b4b'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('A+', 0, 2 * S);
    ctx.restore();
  } else drawStar(x, y, 18 * S, Math.sin(time * 3 + it.x) * 0.3);
}

function text(t, x, y, size, col = INK, align = 'center', outline = true) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  const mw = ctx.measureText(t).width, maxW = W * 0.94;
  if (align === 'center' && mw > maxW) { size *= maxW / mw; ctx.font = `${size}px ${FONT}`; }
  if (outline) { ctx.lineWidth = size * 0.16; ctx.strokeStyle = '#fbf8ef'; ctx.lineJoin = 'round'; ctx.strokeText(t, x, y); }
  ctx.fillStyle = col; ctx.fillText(t, x, y);
}
function stickyNote(x, y, wd, ht, rot, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(4, 6, wd, ht);
  ctx.fillStyle = col; ctx.fillRect(0, 0, wd, ht);
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(wd * 0.35, -8, wd * 0.3, 18);
  ctx.restore();
}

// ---------- Update ----------
function update(dt) {
  time += dt;
  if (Math.floor(time / 0.12) !== boil) boil = Math.floor(time / 0.12);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats) { f.y -= 60 * dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);
  if (banner.t > 0) banner.t -= dt;
  shake = Math.max(0, shake - dt * 30);

  if (state === 'menu') { scrollX += 120 * dt; return; }
  if (state === 'over') {
    overT += dt;
    hero.vy += 2600 * dt; hero.y = Math.min(0, hero.y + hero.vy * dt * 0.5); hero.rot -= dt * 3;
    return;
  }
  // play
  speed = Math.min(1000, speed + dt * 9);
  const dx = speed * dt;
  scrollX += dx; dist += dx;
  score += dx * 0.02;
  const newLevel = 1 + Math.floor(dist / 4500);
  if (newLevel > level) { level = newLevel; banner = { txt: `NÍVEL ${level}!`, t: 1.6 }; beep(500, 1000, 0.3, 'triangle', 0.15); }

  // hero physics (in S units, y negative = up)
  hero.vy += 2600 * dt; hero.y += hero.vy * dt;
  if (hero.y >= 0) {
    if (hero.jumps > 0) { hero.squash = 0.18; for (let i = 0; i < 5; i++) parts.push({ x: heroX(), y: GY, vx: (Math.random() - 0.5) * 240, vy: -Math.random() * 150, life: 0.4, r: 3 + Math.random() * 4, col: '#aaa' }); }
    hero.y = 0; hero.vy = 0; hero.jumps = 0;
  }
  hero.squash *= Math.pow(0.0001, dt);

  nextObs -= dx; if (nextObs <= 0) spawnObs();
  nextItem -= dx; if (nextItem <= 0) spawnItems();
  for (const o of obs) o.x -= dx;
  for (const it of items) it.x -= dx;
  obs = obs.filter(o => o.x > -150);
  items = items.filter(i => i.x > -150 && !i.got);

  // collisions (in S units)
  const hx = heroX() / S, hy = hero.y;
  const hb = { l: hx - 22, r: hx + 22, t: hy - 200, b: hy - 4 };
  for (const it of items) {
    const iy = -it.y;
    if (Math.abs(it.x - hx) < 40 && iy > hb.t - 20 && iy < hb.b + 20) {
      it.got = true; const val = it.ap ? 50 : 10; score += val;
      floats.push({ x: it.x * S, y: GY + iy * S, txt: '+' + val, life: 0.8, col: it.ap ? '#e23b4b' : '#e2a400' });
      for (let i = 0; i < 8; i++) parts.push({ x: it.x * S, y: GY + iy * S, vx: (Math.random() - 0.5) * 400, vy: (Math.random() - 0.8) * 300, life: 0.6, r: 3 + Math.random() * 4, col: it.ap ? '#e23b4b' : '#ffd23f' });
      beep(it.ap ? 700 : 900, it.ap ? 1600 : 1400, 0.1, 'square', 0.08);
    }
  }
  for (const o of obs) {
    const T = TYPES[o.type];
    const ob = { l: o.x - T.w / 2 + 8, r: o.x + T.w / 2 - 8, t: -T.y - T.h + 6, b: -T.y - (o.type === 'aviao' ? 0 : 0) };
    if (o.type === 'aviao') { ob.t = -T.y - 30; ob.b = -T.y + 4; }
    if (hb.r > ob.l && hb.l < ob.r && hb.b > ob.t && hb.t < ob.b) { gameOver(); break; }
  }
}
function gameOver() {
  state = 'over'; overT = 0; shake = 14;
  hero.vy = -700;
  const final = Math.floor(score);
  if (final > best) { best = final; try { localStorage.setItem('rabiscoBest', best); } catch (e) {} }
  for (let i = 0; i < 26; i++) parts.push({ x: heroX(), y: GY + (hero.y - 100) * S, vx: (Math.random() - 0.5) * 700, vy: (Math.random() - 0.7) * 600, life: 1, r: 4 + Math.random() * 8, col: INK });
  beep(400, 60, 0.6, 'sawtooth', 0.15);
}

// ---------- Render ----------
function render() {
  wc = 0;
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawPaper(); drawBackground(); drawGround();
  items.forEach(drawItem);
  obs.forEach(drawObs);
  for (const p of parts) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2)); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * S, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;

  const blink = (time % 3.2) < 0.12;
  if (state === 'menu') {
    drawHero(W * 0.5, GY - Math.abs(Math.sin(time * 3)) * 30 * S, time, 'idle', 0, 0, blink);
  } else {
    const mode = state === 'over' ? 'hit' : (hero.y < 0 ? 'air' : 'run');
    const rot = state === 'over' ? hero.rot : (hero.jumps === 2 ? (hero.vy < 0 ? -(1 - Math.min(1, -hero.vy / 820)) * 6.28 : 0) : 0);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(heroX(), GY + 4, 34 * S * (1 + hero.y / 500), 7 * S, 0, 0, 7); ctx.fill();
    const by = mode === 'run' ? -Math.abs(Math.sin(time * 15)) * 6 * S : 0;
    if (rot) {
      ctx.save(); ctx.translate(heroX(), GY + hero.y * S - 100 * S); ctx.rotate(rot);
      drawHero(0, 100 * S, time, mode, hero.squash, 0, blink); ctx.restore();
    } else drawHero(heroX(), GY + hero.y * S + by, time, mode, hero.squash, 0, blink);
  }
  for (const f of floats) { ctx.globalAlpha = Math.min(1, f.life * 2); text(f.txt, f.x, f.y, 34 * S, f.col); }
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD
  if (state !== 'menu') {
    stickyNote(20 * S, 20 * S, 220 * S, 92 * S, -0.03, '#fff27a');
    text('PONTOS', 130 * S, 46 * S, 26 * S, '#7a6a10', 'center', false);
    text(Math.floor(score), 130 * S, 84 * S, 44 * S, INK, 'center', false);
    stickyNote(W - 220 * S, 20 * S, 200 * S, 92 * S, 0.04, '#9fe7ff');
    text('RECORDE', W - 120 * S, 48 * S, 26 * S, '#1a6a80', 'center', false);
    text(Math.max(best, Math.floor(score)), W - 120 * S, 86 * S, 44 * S, INK, 'center', false);
    text('Nível ' + level, W / 2, 50 * S, 32 * S, '#555');
  }
  if (banner.t > 0 && state === 'play') {
    const a = Math.min(1, banner.t * 2), sc = 1 + (1.6 - banner.t) * 0.1;
    ctx.globalAlpha = a; text(banner.txt, W / 2, H * 0.35, 90 * S * sc, '#e23b4b'); ctx.globalAlpha = 1;
  }
  if (state === 'menu') {
    const bob = Math.sin(time * 2) * 6 * S;
    ctx.save(); ctx.translate(W / 2, H * 0.2 + bob); ctx.rotate(-0.03);
    text('CORRE, RABISCO!', 0, 0, 120 * S, '#e23b4b');
    ctx.restore();
    text('Um herói desenhado à mão fugindo das borrachas!', W / 2, H * 0.31, 36 * S, INK);
    if (Math.sin(time * 5) > -0.4) text('Toque ou aperte ESPAÇO para começar', W / 2, H * 0.4, 44 * S, '#3d7bff');
    text('Pule: ESPAÇO / toque  •  Pulo duplo: aperte de novo no ar!', W / 2, H * 0.92, 28 * S, '#555');
    // legend
    ctx.save();
    const lx = W * 0.72, ly = GY;
    drawObs({ type: 'borracha', x: (lx) / S, wob: 0 });
    drawStar(W * 0.28, GY - 60 * S, 22 * S, 0);
    ctx.restore();
    text('pegue ⭐', W * 0.28, GY - 105 * S, 30 * S, '#b88a00');
    text('desvie!', W * 0.72, GY - 75 * S, 30 * S, '#e23b4b');
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(251,248,239,.55)'; ctx.fillRect(0, 0, W, H);
    const pop = Math.min(1, overT * 3);
    ctx.save(); ctx.translate(W / 2, H * 0.3); ctx.scale(pop, pop); ctx.rotate(-0.04);
    text('APAGADO!', 0, 0, 130 * S, '#e23b4b');
    ctx.restore();
    text(`Você fez ${Math.floor(score)} pontos`, W / 2, H * 0.44, 54 * S, INK);
    if (Math.floor(score) >= best && best > 0) text('🏆 NOVO RECORDE! 🏆', W / 2, H * 0.53, 46 * S, '#e2a400');
    if (overT > 0.6 && Math.sin(time * 5) > -0.4) text('Toque ou ESPAÇO para tentar de novo', W / 2, H * 0.63, 40 * S, '#3d7bff');
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
