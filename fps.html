<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caçadores de Vírus</title>
<style>
  html,body{margin:0;height:100%;background:#05010f;overflow:hidden;font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:#fff;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #game{image-rendering:pixelated;image-rendering:crisp-edges}
  #fx{pointer-events:none}
  .ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,0,40,.55),rgba(5,0,15,.92));z-index:5;transition:opacity .4s}
  .ov.hide{opacity:0;pointer-events:none}
  .card{text-align:center;max-width:760px;padding:24px}
  h1{margin:0;font-size:clamp(44px,9vw,110px);line-height:.9;letter-spacing:4px;font-style:italic;
     background:linear-gradient(180deg,#fff 0%,#7ff6ff 35%,#ff2bd6 70%,#7a1cff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 0 18px rgba(255,43,214,.7)) drop-shadow(0 0 40px rgba(0,240,255,.4));animation:flick 3s infinite}
  h1 span{font-size:.6em;letter-spacing:12px}
  @keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.5}95%{opacity:1}97%{opacity:.7}}
  p{font-size:clamp(16px,2.2vw,22px);color:#d9c8ff;line-height:1.45;margin:22px auto}
  .keys{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0 26px}
  .keys b{border:2px solid #00f0ff;color:#bff9ff;padding:6px 12px;border-radius:8px;font-size:15px;box-shadow:0 0 12px rgba(0,240,255,.5);background:rgba(0,240,255,.08)}
  button{font:inherit;font-size:clamp(22px,3vw,32px);font-weight:bold;letter-spacing:3px;color:#fff;cursor:pointer;
     padding:14px 48px;border:none;border-radius:14px;background:linear-gradient(90deg,#ff2bd6,#7a1cff);
     box-shadow:0 0 25px #ff2bd6,0 0 60px rgba(122,28,255,.6);animation:pulse 1.4s infinite}
  button:hover{transform:scale(1.06)}
  @keyframes pulse{50%{box-shadow:0 0 40px #ff2bd6,0 0 90px rgba(0,240,255,.6)}}
  #best{margin-top:18px;color:#7ff6ff;font-size:18px;letter-spacing:2px}
  .big{font-size:clamp(30px,5vw,56px);color:#7ff6ff;text-shadow:0 0 20px #00f0ff;margin:10px 0}
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="fx"></canvas>
<div id="menu" class="ov"><div class="card" id="card"></div></div>
<script>
'use strict';
// ================== SETUP ==================
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const fx=document.getElementById('fx'), g=fx.getContext('2d');
let W=400,H=240,VW=innerWidth,VH=innerHeight,img,buf,zbuf;
function resize(){
  VW=innerWidth;VH=innerHeight;H=240;W=Math.max(240,Math.round(H*VW/VH));
  cv.width=W;cv.height=H;img=ctx.createImageData(W,H);buf=new Uint32Array(img.data.buffer);zbuf=new Float32Array(W);
  const dpr=Math.min(2,devicePixelRatio||1);fx.width=VW*dpr;fx.height=VH*dpr;g.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);resize();

// ================== MAPA ==================
const MAP=[
"222222222222222222222222",
"2..........2...........2",
"2..........2...........2",
"2...33.....2.....33....2",
"2...33...........33....2",
"2......................2",
"2........111111........2",
"2......................2",
"2..3.............1..3..2",
"2..3....1....1...1..3..2",
"2..3....1.......1..3...2",
"2.......1.......1......2",
"2......................2",
"2222.....33..33.....2222",
"2......................2",
"2...1..............1...2",
"2...1....222222....1...2",
"2...1..............1...2",
"2......................2",
"2..33......1.......33..2",
"2..33......1.......33..2",
"2..........1...........2",
"2......................2",
"222222222222222222222222"];
const MW=MAP[0].length,MH=MAP.length,grid=new Uint8Array(MW*MH);
for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)grid[y*MW+x]=MAP[y][x]==='.'?0:+MAP[y][x];
function cell(x,y){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=MW||y>=MH)return 2;return grid[y*MW+x];}
const WALL=[null,[0,240,255],[255,40,200],[255,190,40]];
const FOG=[70,10,105];

// ================== ESTADO ==================
const TYPES={
  bug:  {c:[70,255,120], hp:2,speed:1.35,size:0.62,hz:0.42,spikes:8, score:100,dmg:22},
  speed:{c:[255,90,50],  hp:1,speed:2.7, size:0.42,hz:0.33,spikes:6, score:150,dmg:16},
  tank: {c:[175,80,255], hp:7,speed:0.8, size:1.0, hz:0.5, spikes:12,score:350,dmg:35}
};
let state='menu',t=0,P,enemies=[],parts=[],pickups=[],texts=[],banner=null;
let score=0,kills=0,wave=0,queue=[],spawnT=0,betweenT=0,combo=0,comboT=0;
let cool=0,flashT=0,recoil=0,hitT=0,dmgFlash=0,shake=0,bobT=0,moving=false,hor=120,laserT=0,hurtSnd=0,spread=0;
let best=0;try{best=+localStorage.getItem('cv_best')||0}catch(e){}
const keys={};let mouseDown=false;

function reset(){
  P={x:14.5,y:21.5,a:-Math.PI/2,hp:100};
  enemies=[];parts=[];pickups=[];texts=[];banner=null;score=0;kills=0;wave=0;queue=[];spawnT=1;betweenT=0;combo=0;comboT=0;
}
reset();
function demoEnemies(){
  enemies=[];const spots=[[12,8],[6,12],[18,14],[9,4],[15,18],[20,6]];
  const ty=['bug','tank','speed','bug','bug','speed'];
  spots.forEach((s,i)=>enemies.push(mkEnemy(ty[i],s[0]+.5,s[1]+.5)));
}
demoEnemies();
function mkEnemy(type,x,y){const T=TYPES[type];return{type,T,x,y,hp:T.hp,ph:Math.random()*6,flash:0,kx:0,ky:0,spd:T.speed*(1+wave*0.05)};}
function spawnEnemy(type){
  for(let i=0;i<80;i++){const x=1+Math.random()*(MW-2)|0,y=1+Math.random()*(MH-2)|0;
    if(cell(x,y)===0&&Math.hypot(x+.5-P.x,y+.5-P.y)>7){enemies.push(mkEnemy(type,x+.5,y+.5));
      for(let k=0;k<20;k++)parts.push(part(x+.5,y+.5,0.5,TYPES[type].c,2));return;}}
}
function nextWave(){
  wave++;queue=[];const n=4+wave*2;
  for(let i=0;i<n;i++){const r=Math.random();let ty='bug';if(wave>=2&&r<0.3)ty='speed';if(wave>=3&&r>0.82)ty='tank';queue.push(ty);}
  showBanner('ONDA '+wave,n+' vírus detectados!');sfx.wave();
}
function showBanner(a,b){banner={a,b,life:2.6};}

// ================== INPUT ==================
let pauseAt=0;
function pauseGame(){if(state!=='play')return;state='pause';pauseAt=performance.now();mouseDown=false;for(const k in keys)keys[k]=false;
  try{if(document.pointerLockElement)document.exitPointerLock();}catch(e){}if(AC)AC.suspend();showPause();}
function resumeGame(){if(state!=='pause')return;state='play';menu.classList.add('hide');if(AC)AC.resume();last=performance.now();lock();}
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&state==='play')pauseGame();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});
addEventListener('keydown',e=>{
  if(e.code==='Escape'){e.preventDefault();if(state==='play')pauseGame();else if(state==='pause'&&performance.now()-pauseAt>300)resumeGame();return;}
  keys[e.code]=true;if(e.code==='Space'){e.preventDefault();if(state==='play')mouseDown=true;}});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Space')mouseDown=false;});
function lock(){try{const r=cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{});}catch(e){}}
addEventListener('mousedown',e=>{if(state!=='play')return;if(document.pointerLockElement!==cv)lock();mouseDown=true;});
addEventListener('mouseup',()=>mouseDown=false);
addEventListener('mousemove',e=>{if(state==='play'&&document.pointerLockElement===cv)P.a+=e.movementX*0.0022;});
addEventListener('contextmenu',e=>e.preventDefault());

// ================== ÁUDIO ==================
let AC=null,master=null,musicBus=null;
function audioInit(){
  if(AC){AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);
  musicBus=AC.createBiquadFilter();musicBus.type='lowpass';musicBus.frequency.value=1400;
  const mg=AC.createGain();mg.gain.value=0.5;musicBus.connect(mg);mg.connect(master);
  startMusic();
}
function tone(f,d,type,vol,to,when,dest){if(!AC)return;const o=AC.createOscillator(),gn=AC.createGain();const t0=when||AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);
  gn.gain.setValueAtTime(vol,t0);gn.gain.exponentialRampToValueAtTime(0.0008,t0+d);o.connect(gn);gn.connect(dest||master);o.start(t0);o.stop(t0+d+0.03);}
let noiseBuf=null;
function noise(d,vol,freq,when,dest){if(!AC)return;if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const gn=AC.createGain();const t0=when||AC.currentTime;
  gn.gain.setValueAtTime(vol,t0);gn.gain.exponentialRampToValueAtTime(0.0008,t0+d);s.connect(f);f.connect(gn);gn.connect(dest||master);s.start(t0);s.stop(t0+d+0.03);}
const sfx={
  shoot(){tone(900,0.12,'square',0.12,180);tone(1800,0.06,'sawtooth',0.05,400);noise(0.06,0.12,4000);},
  hit(){tone(500,0.08,'triangle',0.2,900);},
  kill(){noise(0.35,0.35,1800);tone(300,0.3,'square',0.12,60);tone(1200,0.15,'sine',0.12,2400,AC&&AC.currentTime+0.05);},
  hurt(){tone(160,0.2,'sawtooth',0.2,60);noise(0.15,0.15,700);},
  pick(){[660,880,1320].forEach((f,i)=>tone(f,0.12,'triangle',0.18,0,AC&&AC.currentTime+i*0.07));},
  wave(){[440,554,659,880].forEach((f,i)=>tone(f,0.25,'square',0.08,0,AC&&AC.currentTime+i*0.09));}
};
function startMusic(){
  const m2f=m=>440*Math.pow(2,(m-69)/12);
  const roots=[33,33,29,29,36,36,31,31];const chords=[[57,60,64],[57,60,64],[53,57,60],[53,57,60],[60,64,67],[60,64,67],[55,59,62],[55,59,62]];
  let step=0,next=AC.currentTime+0.1;const st=0.2;
  setInterval(()=>{
    while(next<AC.currentTime+0.25){
      const bar=(step>>3)%8,s8=step%8;
      const root=roots[bar];
      tone(m2f(root+(s8%2?12:0)),0.18,'sawtooth',0.09,0,next,musicBus);
      if(s8%4===0)tone(140,0.18,'sine',0.35,40,next);
      if(s8%4===2)noise(0.12,0.08,3000,next);
      noise(0.03,0.03,9000,next);
      const ch=chords[bar];tone(m2f(ch[step%3]+12),0.15,'triangle',0.035,0,next,musicBus);
      next+=st;step++;
    }
  },60);
}

// ================== LÓGICA ==================
function solid(x,y){return cell(x,y)>0;}
function tryMove(o,dx,dy,r){
  const sx=dx>0?r:-r,sy=dy>0?r:-r;
  if(dx&&!solid(o.x+dx+sx,o.y-r)&&!solid(o.x+dx+sx,o.y+r))o.x+=dx;
  if(dy&&!solid(o.x-r,o.y+dy+sy)&&!solid(o.x+r,o.y+dy+sy))o.y+=dy;
}
function part(x,y,z,c,sp){const a=Math.random()*6.283,s=Math.random()*sp;
  return{x,y,z,vx:Math.cos(a)*s,vy:Math.sin(a)*s,vz:Math.random()*sp*1.5,life:0.6+Math.random()*0.6,c};}
function hurt(a){
  P.hp-=a;dmgFlash=Math.min(0.6,dmgFlash+a*0.03);shake=Math.max(shake,4);
  if(hurtSnd<=0){sfx.hurt();hurtSnd=0.3;}
  if(P.hp<=0&&state==='play'){P.hp=0;gameOver();}
}
function shoot(){
  cool=0.16;flashT=0.07;recoil=1;laserT=0.07;spread=10;sfx.shoot();shake=Math.max(shake,1.5);
  const ca=Math.cos(P.a),sa=Math.sin(P.a),pX=-sa*0.66,pY=ca*0.66,inv=1/(pX*sa-ca*pY);
  let best=null,bd=1e9;const cz=zbuf[W>>1];
  for(const e of enemies){const sx=e.x-P.x,sy=e.y-P.y;const tx=inv*(sa*sx-ca*sy),ty=inv*(-pY*sx+pX*sy);
    if(ty<0.15||ty>cz+0.2)continue;const scx=(W/2)*(1+tx/ty),half=H/ty*e.T.size*0.5;
    const cy=hor+(0.5-(e.T.hz))*H/ty;
    if(Math.abs(scx-W/2)<half*0.75&&Math.abs(cy-H/2)<half*0.9&&ty<bd){bd=ty;best=e;}}
  if(best){
    best.hp--;best.flash=0.08;hitT=0.15;best.kx=ca*3;best.ky=sa*3;sfx.hit();
    for(let i=0;i<8;i++)parts.push(part(best.x-ca*0.2,best.y-sa*0.2,best.T.hz,[255,255,255],2.5));
    if(best.hp<=0)killEnemy(best);
  }else{
    const d=cz-0.05,hx=P.x+ca*d,hy=P.y+sa*d;
    for(let i=0;i<10;i++)parts.push(part(hx,hy,0.5,[0,240,255],2));
  }
}
function killEnemy(e){
  enemies.splice(enemies.indexOf(e),1);kills++;combo++;comboT=2.5;
  const pts=Math.round(e.T.score*(1+(combo-1)*0.25));score+=pts;
  texts.push({s:'+'+pts+(combo>1?'  COMBO x'+combo:''),x:VW/2+(Math.random()-.5)*120,y:VH/2-60,life:1.1,c:combo>1?'#ffe14d':'#7ff6ff'});
  for(let i=0;i<45;i++)parts.push(part(e.x,e.y,e.T.hz,e.T.c,4));
  for(let i=0;i<15;i++)parts.push(part(e.x,e.y,e.T.hz,[255,255,255],3));
  sfx.kill();shake=Math.max(shake,3);
  if(Math.random()<0.22)pickups.push({x:e.x,y:e.y,ph:0});
}
function gameOver(){
  state='over';mouseDown=false;try{document.exitPointerLock();}catch(e){}
  const rec=score>best;if(rec){best=score;try{localStorage.setItem('cv_best',best)}catch(e){}}
  for(let i=0;i<80;i++)parts.push(part(P.x+Math.cos(P.a)*0.8,P.y+Math.sin(P.a)*0.8,0.5,[255,40,200],4));
  setTimeout(()=>showMenu(true,rec),1100);
}
function update(dt){
  if(state==='pause')return;
  t+=dt;
  if(state==='menu'){P.a+=dt*0.15;for(const e of enemies)e.ph+=dt*3;updParts(dt);return;}
  if(state!=='play'){updParts(dt);for(const e of enemies)e.ph+=dt*3;dmgFlash=Math.max(0,dmgFlash-dt);return;}
  if(keys.ArrowLeft||keys.KeyQ)P.a-=2.6*dt;if(keys.ArrowRight||keys.KeyE)P.a+=2.6*dt;
  const ca=Math.cos(P.a),sa=Math.sin(P.a);let mx=0,my=0;
  if(keys.KeyW||keys.ArrowUp){mx+=ca;my+=sa;}if(keys.KeyS||keys.ArrowDown){mx-=ca;my-=sa;}
  if(keys.KeyD){mx-=sa;my+=ca;}if(keys.KeyA){mx+=sa;my-=ca;}
  const len=Math.hypot(mx,my);moving=len>0;const sprint=keys.ShiftLeft||keys.ShiftRight;
  if(len){const sp=(sprint?5.2:3.4)*dt/len;tryMove(P,mx*sp,my*sp,0.25);bobT+=dt*(sprint?14:10);}
  cool-=dt;flashT=Math.max(0,flashT-dt);laserT=Math.max(0,laserT-dt);recoil=Math.max(0,recoil-dt*7);hitT=Math.max(0,hitT-dt);
  dmgFlash=Math.max(0,dmgFlash-dt*0.8);shake=Math.max(0,shake-dt*12);hurtSnd-=dt;spread=Math.max(0,spread-dt*60);
  if(mouseDown&&cool<=0)shoot();
  comboT-=dt;if(comboT<=0)combo=0;
  // ondas
  if(queue.length){spawnT-=dt;if(spawnT<=0){spawnEnemy(queue.shift());spawnT=Math.max(0.35,1.1-wave*0.07);}}
  else if(!enemies.length){if(betweenT<=0){betweenT=3;showBanner('ONDA LIMPA!','+20 de sistema restaurado');P.hp=Math.min(100,P.hp+20);sfx.pick();}
    betweenT-=dt;if(betweenT<=0)nextWave();}
  // inimigos
  for(const e of enemies){
    e.ph+=dt*3;e.flash=Math.max(0,e.flash-dt);
    let dx=P.x-e.x,dy=P.y-e.y;const d=Math.hypot(dx,dy);
    if(d>0.65){const w=Math.sin(e.ph*0.5)*0.6,c=Math.cos(w),s=Math.sin(w);const nx=(dx*c-dy*s)/d,ny=(dx*s+dy*c)/d;
      const sp=e.spd*dt;tryMove(e,nx*sp,ny*sp,e.T.size*0.3);}
    else hurt(e.T.dmg*dt);
    if(e.kx||e.ky){tryMove(e,e.kx*dt,e.ky*dt,e.T.size*0.3);e.kx*=0.85;e.ky*=0.85;if(Math.abs(e.kx)<0.01)e.kx=e.ky=0;}
    for(const o of enemies){if(o===e)continue;const ox=e.x-o.x,oy=e.y-o.y,od=Math.hypot(ox,oy),md=(e.T.size+o.T.size)*0.35;
      if(od<md&&od>0.001){tryMove(e,ox/od*(md-od)*0.5,oy/od*(md-od)*0.5,e.T.size*0.3);}}
  }
  for(let i=pickups.length-1;i>=0;i--){const k=pickups[i];k.ph+=dt*3;
    if(Math.hypot(k.x-P.x,k.y-P.y)<0.6){P.hp=Math.min(100,P.hp+25);pickups.splice(i,1);sfx.pick();
      texts.push({s:'+25 SISTEMA',x:VW/2,y:VH/2+60,life:1,c:'#5dffb0'});}}
  updParts(dt);
  for(let i=texts.length-1;i>=0;i--){texts[i].life-=dt;texts[i].y-=40*dt;if(texts[i].life<=0)texts.splice(i,1);}
  if(banner){banner.life-=dt;if(banner.life<=0)banner=null;}
}
function updParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=6*dt;
    if(p.z<0){p.z=0;p.vz*=-0.4;p.vx*=0.6;p.vy*=0.6;}if(solid(p.x,p.y)){p.vx*=-0.5;p.vy*=-0.5;p.x+=p.vx*dt*2;p.y+=p.vy*dt*2;}
    p.life-=dt;if(p.life<=0)parts.splice(i,1);}
}

// ================== RENDER 3D ==================
let SR=0,SG=0,SB=0;
function shVirus(u,v,e){
  const r=Math.sqrt(u*u+v*v);if(r>1)return false;
  const T=e.T,a=Math.atan2(v,u);
  const sp=Math.pow(Math.max(0,Math.cos(a*T.spikes+e.ph)),10);
  const R=0.6+0.38*sp;if(r>R)return false;
  const cr=T.c[0],cg=T.c[1],cb=T.c[2];
  if(e.flash>0){SR=SG=SB=255;return true;}
  if(r>0.58){const k=0.7+(r-0.58)*2.5;SR=cr*k+60;SG=cg*k+60;SB=cb*k+60;return true;}
  const au=Math.abs(u);
  // sobrancelhas bravas
  if(au>0.08&&au<0.38&&Math.abs(v-(-0.25-(au-0.1)*0.45))<0.04){SR=20;SG=0;SB=30;return true;}
  // olhos
  const ex=u<0?u+0.22:u-0.22,ey=v+0.11;
  if(ex*ex+ey*ey<0.019){const px=ex-(u<0?0.03:-0.03),py=ey-0.02;
    if(px*px+py*py<0.0045){SR=15;SG=0;SB=25;}else{SR=SG=SB=255;}return true;}
  // boca com dentes
  const my=0.27-u*u*1.3;
  if(au<0.3&&v<my&&v>my-0.09){if(v<my-0.05&&((u*14+100)|0)%2===0){SR=SG=SB=240;}else{SR=40;SG=0;SB=30;}return true;}
  const n=Math.sqrt(Math.max(0,1-(r/0.58)*(r/0.58)));
  let l=0.25+0.55*n+0.35*(-u-v)*0.8;if(r>0.52)l=1.25;
  // manchas
  if(Math.sin(u*9+e.ph*0.3)*Math.sin(v*9)>0.75)l*=0.7;
  SR=cr*l;SG=cg*l;SB=cb*l;return true;
}
function shOrb(u,v,k){
  const r=Math.sqrt(u*u+v*v);if(r>0.55)return false;
  const au=Math.abs(u),av=Math.abs(v);
  if((au<0.1&&av<0.32)||(av<0.1&&au<0.32)){SR=SG=SB=255;return true;}
  const l=0.6+0.6*(1-r/0.55)+0.2*Math.sin(k.ph*2);SR=40*l;SG=255*l;SB=170*l;return true;
}
function put(i,r,gg,b,fog){
  r+= (FOG[0]-r)*fog;gg+=(FOG[1]-gg)*fog;b+=(FOG[2]-b)*fog;
  buf[i]=0xff000000|((b>255?255:b)<<16)|((gg>255?255:gg)<<8)|(r>255?255:r);
}
function drawSprite(ox,oy,size,hz,sh,obj,ca,sa,pX,pY,inv){
  const sx=ox-P.x,sy=oy-P.y;const tx=inv*(sa*sx-ca*sy),ty=inv*(-pY*sx+pX*sy);
  if(ty<0.15)return;
  const scx=(W/2)*(1+tx/ty),half=H/ty*size*0.5,cy=hor+(0.5-hz)*H/ty;
  const x0=Math.max(0,Math.floor(scx-half)),x1=Math.min(W-1,Math.ceil(scx+half));
  const y0=Math.max(0,Math.floor(cy-half)),y1=Math.min(H-1,Math.ceil(cy+half));
  const fog=Math.min(1,ty/16)*0.85,ih=1/half;
  for(let x=x0;x<=x1;x++){if(ty>=zbuf[x])continue;const u=(x-scx)*ih;
    for(let y=y0;y<=y1;y++){if(sh(u,(y-cy)*ih,obj))put(y*W+x,SR|0,SG|0,SB|0,fog);}}
}
function render(){
  const ca=Math.cos(P.a),sa=Math.sin(P.a),pX=-sa*0.66,pY=ca*0.66;
  hor=(H/2+(moving?Math.sin(bobT)*3:0))|0;
  // chão e teto (grade neon)
  const r0x=ca-pX,r0y=sa-pY,r1x=ca+pX,r1y=sa+pY,halfH=H*0.5;let idx=0;
  for(let y=0;y<H;y++){
    const fl=y>hor;let p=fl?y-hor:hor-y;if(p<1)p=1;
    const rd=halfH/p,stx=rd*(r1x-r0x)/W,sty=rd*(r1y-r0y)/W;
    let wx=P.x+rd*r0x,wy=P.y+rd*r0y;
    const fog=Math.min(1,rd/16),pulse=(0.6+0.4*Math.sin(rd*1.3-t*3))*(1-fog)*(fl?1:0.45);
    const LR=fl?255:0,LG=fl?40:200,LB=fl?200:255,BR=fl?16:6,BG=fl?4:2,BB=fl?36:24;
    for(let x=0;x<W;x++,idx++){
      const gx=wx-Math.floor(wx),gy=wy-Math.floor(wy);
      let d=gx<gy?gx:gy;const ex=1-gx,ey=1-gy;if(ex<d)d=ex;if(ey<d)d=ey;
      const l=(d<0.035?1:(d<0.1?(0.1-d)*5:0))*pulse;
      put(idx,(BR+LR*l)|0,(BG+LG*l)|0,(BB+LB*l)|0,fog);
      wx+=stx;wy+=sty;
    }
  }
  // paredes
  for(let x=0;x<W;x++){
    const cam=2*x/W-1,rx=ca+pX*cam,ry=sa+pY*cam;
    let mX=Math.floor(P.x),mY=Math.floor(P.y);const ddx=Math.abs(1/rx),ddy=Math.abs(1/ry);
    let stX,stY,sdx,sdy;
    if(rx<0){stX=-1;sdx=(P.x-mX)*ddx;}else{stX=1;sdx=(mX+1-P.x)*ddx;}
    if(ry<0){stY=-1;sdy=(P.y-mY)*ddy;}else{stY=1;sdy=(mY+1-P.y)*ddy;}
    let side=0,hit=0,n=0;
    while(!hit&&n++<80){if(sdx<sdy){sdx+=ddx;mX+=stX;side=0;}else{sdy+=ddy;mY+=stY;side=1;}hit=cell(mX,mY);}
    const dist=Math.max(0.05,side===0?sdx-ddx:sdy-ddy);zbuf[x]=dist;
    let wX=side===0?P.y+dist*ry:P.x+dist*rx;wX-=Math.floor(wX);
    const lh=H/dist,top=hor-lh/2,y0=Math.max(0,Math.ceil(top)),y1=Math.min(H,Math.floor(top+lh));
    const col=WALL[hit]||WALL[2],sh=side?0.7:1,fog=Math.min(1,dist/16),ew=Math.min(wX,1-wX);
    const cr=col[0]*sh,cg=col[1]*sh,cb=col[2]*sh;
    for(let y=y0;y<y1;y++){
      const v=(y-top)/lh,ev=v<1-v?v:1-v,e=ew<ev?ew:ev;
      let l=e<0.025?1.3:(e<0.09?(0.09-e)*4.5:0);
      if((v*4)%1<0.035)l+=0.4;
      if(Math.abs(wX-0.5)<0.02&&((v*4)%1>0.3&&(v*4)%1<0.7))l+=0.5;
      l+=0.1;
      put(y*W+x,(cr*l)|0,(cg*l)|0,(cb*l)|0,fog);
    }
  }
  // sprites
  const inv=1/(pX*sa-ca*pY);
  const list=[];
  for(const e of enemies)list.push({d:(e.x-P.x)**2+(e.y-P.y)**2,e});
  for(const k of pickups)list.push({d:(k.x-P.x)**2+(k.y-P.y)**2,k});
  list.sort((a,b)=>b.d-a.d);
  for(const o of list){
    if(o.e){const e=o.e;drawSprite(e.x,e.y,e.T.size,e.T.hz+Math.sin(e.ph)*0.04,shVirus,e,ca,sa,pX,pY,inv);}
    else{const k=o.k;drawSprite(k.x,k.y,0.45,0.25+Math.sin(k.ph)*0.06,shOrb,k,ca,sa,pX,pY,inv);}
  }
  // partículas
  for(const p of parts){
    const sx=p.x-P.x,sy=p.y-P.y,tx=inv*(sa*sx-ca*sy),ty=inv*(-pY*sx+pX*sy);if(ty<0.15)continue;
    const scx=((W/2)*(1+tx/ty))|0,scy=(hor+(0.5-p.z)*H/ty)|0,s=Math.max(1,(0.05*H/ty)|0);
    if(scx<0||scx>=W||ty>=zbuf[scx])continue;const a=Math.min(1,p.life*2);
    for(let yy=scy;yy<scy+s;yy++){if(yy<0||yy>=H)continue;for(let xx=scx;xx<scx+s&&xx<W;xx++)
      put(yy*W+xx,(p.c[0]*a+20)|0,(p.c[1]*a+20)|0,(p.c[2]*a+20)|0,0);}
  }
  ctx.putImageData(img,0,0);
}

// ================== HUD / ARMA ==================
function rr(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);g.fill();}
function drawGun(){
  const s=Math.min(VW,VH)/720;
  const swx=moving?Math.sin(bobT*0.5)*12*s:0,swy=moving?Math.abs(Math.cos(bobT*0.5))*10*s:0;
  const gx=VW/2+210*s+swx,gy=VH+60*s+swy+recoil*45*s,th=-0.25-recoil*0.08;
  const tip={x:gx+272*s*Math.sin(th),y:gy-272*s*Math.cos(th)};
  // laser
  if(laserT>0){g.save();g.globalCompositeOperation='lighter';const a=laserT/0.07;
    g.strokeStyle='rgba(0,240,255,'+a+')';g.lineWidth=14*s*a;g.shadowColor='#00f0ff';g.shadowBlur=30;
    g.beginPath();g.moveTo(tip.x,tip.y);g.lineTo(VW/2,VH/2);g.stroke();
    g.strokeStyle='rgba(255,255,255,'+a+')';g.lineWidth=4*s*a;g.stroke();g.restore();}
  g.save();g.translate(gx,gy);g.rotate(th);g.scale(s,s);
  g.fillStyle='#14062a';rr(-45,30,95,200,24);
  let gr=g.createLinearGradient(-75,0,75,0);gr.addColorStop(0,'#2a0850');gr.addColorStop(0.5,'#8a2be2');gr.addColorStop(1,'#1e0640');
  g.fillStyle=gr;rr(-75,-115,150,200,34);
  gr=g.createLinearGradient(-38,0,38,0);gr.addColorStop(0,'#10041f');gr.addColorStop(0.5,'#43207a');gr.addColorStop(1,'#10041f');
  g.fillStyle=gr;rr(-38,-275,76,190,22);
  g.shadowColor='#00f0ff';g.shadowBlur=22;g.fillStyle='#00f0ff';
  for(let i=0;i<3;i++)rr(-44,-250+i*50,88,11,5);
  g.shadowColor='#ff2bd6';g.fillStyle='#ff2bd6';rr(-66,-70,10,120,5);rr(56,-70,10,120,5);
  const pu=0.5+0.5*Math.sin(t*6);g.shadowBlur=30+pu*25;
  const rg=g.createRadialGradient(0,-25,0,0,-25,38);rg.addColorStop(0,'#fff');rg.addColorStop(0.4,'#ff7be9');rg.addColorStop(1,'rgba(255,43,214,0)');
  g.fillStyle=rg;g.beginPath();g.arc(0,-25,38,0,7);g.fill();
  g.shadowColor='#00f0ff';g.shadowBlur=25;g.fillStyle='#c8fbff';g.beginPath();g.ellipse(0,-276,32,9,0,0,7);g.fill();
  if(flashT>0){const a=flashT/0.07;g.globalCompositeOperation='lighter';
    const fg=g.createRadialGradient(0,-300,0,0,-300,150*a);fg.addColorStop(0,'rgba(255,255,255,'+a+')');fg.addColorStop(0.3,'rgba(0,240,255,'+a*0.8+')');fg.addColorStop(1,'rgba(255,43,214,0)');
    g.fillStyle=fg;g.beginPath();g.arc(0,-300,150*a,0,7);g.fill();}
  g.restore();
}
function neonText(txt,x,y,size,color,align){
  g.font='bold '+size+'px "Trebuchet MS",sans-serif';g.textAlign=align||'left';g.textBaseline='middle';
  g.shadowColor=color;g.shadowBlur=16;g.fillStyle=color;g.fillText(txt,x,y);g.shadowBlur=0;g.fillStyle='#fff';g.globalAlpha*=0.9;g.fillText(txt,x,y);g.globalAlpha=1;
}
function drawHUD(){
  g.clearRect(0,0,VW,VH);
  // scanlines leves
  g.fillStyle='rgba(0,0,0,0.12)';for(let y=0;y<VH;y+=4)g.fillRect(0,y,VW,1);
  if(state==='menu')return;
  if(state==='play'||state==='pause')drawGun();
  const s=Math.min(VW,VH)/720,cx=VW/2,cy=VH/2;
  // mira
  if(state==='play'){const gp=(10+spread)*s,L=14*s;g.strokeStyle=hitT>0?'#ffe14d':'#7ff6ff';g.lineWidth=3*s;g.shadowColor=g.strokeStyle;g.shadowBlur=10;
    g.beginPath();g.moveTo(cx-gp-L,cy);g.lineTo(cx-gp,cy);g.moveTo(cx+gp,cy);g.lineTo(cx+gp+L,cy);g.moveTo(cx,cy-gp-L);g.lineTo(cx,cy-gp);g.moveTo(cx,cy+gp);g.lineTo(cx,cy+gp+L);g.stroke();
    if(hitT>0){g.strokeStyle='#fff';const a=8*s,b=18*s;g.beginPath();g.moveTo(cx-b,cy-b);g.lineTo(cx-a,cy-a);g.moveTo(cx+b,cy-b);g.lineTo(cx+a,cy-a);g.moveTo(cx-b,cy+b);g.lineTo(cx-a,cy+a);g.moveTo(cx+b,cy+b);g.lineTo(cx+a,cy+a);g.stroke();}
    g.shadowBlur=0;}
  // vinheta de dano
  if(dmgFlash>0){const vg=g.createRadialGradient(cx,cy,Math.min(VW,VH)*0.25,cx,cy,Math.max(VW,VH)*0.7);
    vg.addColorStop(0,'rgba(255,0,60,0)');vg.addColorStop(1,'rgba(255,0,60,'+Math.min(0.75,dmgFlash)+')');g.fillStyle=vg;g.fillRect(0,0,VW,VH);}
  if(P.hp<30&&state==='play'){g.fillStyle='rgba(255,0,60,'+(0.08+0.08*Math.sin(t*8))+')';g.fillRect(0,0,VW,VH);}
  // textos
  const m=24*s+10;
  neonText('PONTOS '+score,m,m+10*s,30*s+8,'#ff2bd6');
  if(combo>1)neonText('COMBO x'+combo,m,m+48*s,24*s+6,'#ffe14d');
  neonText('ONDA '+wave,VW-m,m+10*s,30*s+8,'#00f0ff','right');
  neonText('vírus: '+(enemies.length+queue.length),VW-m,m+46*s,20*s+6,'#7ff6ff','right');
  // vida
  const bw=320*s+60,bh=22*s+6,bx=m,by=VH-m-bh;
  neonText('SISTEMA '+Math.ceil(P.hp)+'%',bx,by-18*s-6,22*s+6,P.hp<30?'#ff3060':'#5dffb0');
  g.fillStyle='rgba(255,255,255,0.08)';rr(bx,by,bw,bh,bh/2);
  const hg=g.createLinearGradient(bx,0,bx+bw,0);hg.addColorStop(0,'#ff2bd6');hg.addColorStop(1,'#00f0ff');
  g.fillStyle=P.hp<30?'#ff3060':hg;g.shadowColor='#00f0ff';g.shadowBlur=15;rr(bx,by,Math.max(0,bw*P.hp/100),bh,bh/2);g.shadowBlur=0;
  // minimapa
  const ms=Math.max(3,5*s),mx0=VW-m-MW*ms,my0=m+70*s+10;
  g.globalAlpha=0.75;g.fillStyle='rgba(10,0,30,0.7)';g.fillRect(mx0-4,my0-4,MW*ms+8,MH*ms+8);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const c=grid[y*MW+x];if(c){const w=WALL[c];g.fillStyle='rgb('+w[0]+','+w[1]+','+w[2]+')';g.fillRect(mx0+x*ms,my0+y*ms,ms,ms);}}
  for(const e of enemies){g.fillStyle='rgb('+e.T.c.join(',')+')';g.fillRect(mx0+e.x*ms-ms*0.5,my0+e.y*ms-ms*0.5,ms,ms);}
  g.fillStyle='#fff';g.beginPath();g.arc(mx0+P.x*ms,my0+P.y*ms,ms*0.7,0,7);g.fill();
  g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(mx0+P.x*ms,my0+P.y*ms);g.lineTo(mx0+(P.x+Math.cos(P.a)*2)*ms,my0+(P.y+Math.sin(P.a)*2)*ms);g.stroke();
  g.globalAlpha=1;
  // textos flutuantes
  for(const tx of texts){g.globalAlpha=Math.min(1,tx.life*2);neonText(tx.s,tx.x,tx.y,26*s+8,tx.c,'center');}g.globalAlpha=1;
  if(banner){const a=Math.min(1,banner.life*2,(2.6-banner.life)*4);g.globalAlpha=a;
    neonText(banner.a,cx,cy-130*s,70*s+10,'#ff2bd6','center');neonText(banner.b,cx,cy-75*s,26*s+8,'#7ff6ff','center');g.globalAlpha=1;}
  if(state==='play'&&document.pointerLockElement!==cv&&t%1.2<0.8)neonText('clique para mirar com o mouse  (ou use ← → para virar)',cx,VH-m-10*s,18*s+6,'#ffe14d','center');
}

// ================== MENU ==================
const menu=document.getElementById('menu'),card=document.getElementById('card');
function showMenu(over,rec){
  state=over?'over':'menu';
  card.innerHTML=over?
    `<h1>SISTEMA<br><span>INFECTADO</span></h1>
     <div class="big">${score} pontos</div>
     <p>Você eliminou <b>${kills}</b> vírus e chegou até a <b>onda ${wave}</b>.${rec?'<br>🏆 <b style="color:#ffe14d">NOVO RECORDE!</b>':''}</p>
     <button id="play">↻ JOGAR DE NOVO</button><div id="best">RECORDE: ${best}</div>`:
    `<h1>CAÇADORES<br><span>DE VÍRUS</span></h1>
     <p>Você é um <b style="color:#7ff6ff">antivírus</b> preso dentro do computador.<br>Os vírus invadiram a rede — elimine todos antes que eles corrompam o sistema!</p>
     <div class="keys"><b>W A S D · andar</b><b>MOUSE · mirar</b><b>CLIQUE · atirar</b><b>SHIFT · correr</b><b>ESC · pausar</b></div>
     <button id="play">▶ JOGAR</button>${best?`<div id="best">RECORDE: ${best}</div>`:''}`;
  menu.classList.remove('hide');
  document.getElementById('play').onclick=startGame;
}
function showPause(){
  card.innerHTML=`<h1>PAUSA</h1>
     <p>O jogo está pausado. Aperte <b style="color:#7ff6ff">ESC</b> ou clique para continuar.</p>
     <div class="keys"><b>W A S D · andar</b><b>MOUSE · mirar</b><b>CLIQUE · atirar</b><b>SHIFT · correr</b><b>ESC · pausar</b></div>
     <button id="play">▶ CONTINUAR</button><div style="margin-top:18px"><button id="restart" style="font-size:18px;padding:10px 28px;animation:none;background:#2a0850;box-shadow:0 0 12px #7a1cff">↺ RECOMEÇAR</button></div>`;
  menu.classList.remove('hide');
  document.getElementById('play').onclick=resumeGame;
  document.getElementById('restart').onclick=()=>{if(AC)AC.resume();startGame();};
}
function startGame(){
  audioInit();reset();state='play';menu.classList.add('hide');nextWave();lock();
}
showMenu(false);

// ================== LOOP ==================
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);render();drawHUD();
  const sh=shake>0?`translate(${(Math.random()-.5)*shake*2}px,${(Math.random()-.5)*shake*2}px)`:'';
  cv.style.transform=sh;fx.style.transform=sh;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
