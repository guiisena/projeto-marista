<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Herói do Caderno</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#f4efe1;font-family:"Comic Sans MS","Segoe Print",system-ui,sans-serif;touch-action:none;user-select:none}
  canvas{display:block}
  .tela{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(244,239,225,.92);text-align:center;padding:20px;z-index:5}
  .esconde{display:none}
  h1{font-size:clamp(40px,8vw,84px);color:#1d3b8f;transform:rotate(-3deg);text-shadow:4px 4px 0 #f2b631}
  h2{font-size:clamp(28px,5vw,48px);color:#1d3b8f}
  p{font-size:clamp(16px,2.4vw,22px);color:#333;max-width:640px}
  button{font-family:inherit;font-size:26px;padding:14px 38px;border:4px solid #1d1d1d;border-radius:14px;background:#f2b631;color:#1d1d1d;cursor:pointer;box-shadow:5px 5px 0 #1d1d1d;transform:rotate(-1deg)}
  button:hover{transform:rotate(1deg) scale(1.05)}
  .cartas{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  .carta{width:190px;padding:22px 14px;background:#fff;border:4px solid #1d1d1d;border-radius:14px;box-shadow:5px 5px 0 #1d3b8f;cursor:pointer;font-size:20px}
  .carta:hover{transform:translateY(-6px) rotate(-1deg)}
  .carta b{display:block;font-size:44px;margin-bottom:8px}
  #heroiPrev{width:150px;height:200px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="tela">
  <h1>Herói do Caderno</h1>
  <canvas id="heroiPrev" width="150" height="200"></canvas>
  <p>As tarefas criaram vida e invadiram a folha! Sobreviva, junte as estrelinhas douradas e fique mais forte.</p>
  <p style="font-size:16px">WASD / setas para andar · no celular, arraste o dedo · o tiro é automático</p>
  <button id="btnJogar">Começar!</button>
</div>

<div id="nivel" class="tela esconde">
  <h2>Subiu de nível! Escolha uma melhoria:</h2>
  <div class="cartas" id="cartas"></div>
</div>

<div id="fim" class="tela esconde">
  <h2>As tarefas venceram...</h2>
  <p id="resumo"></p>
  <button id="btnDeNovo">Jogar de novo</button>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H;
function redim(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', redim); redim();

// ---------- ÁUDIO ----------
let ac = null;
function som(freq, dur, tipo='square', vol=.08, slide=0){
  if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = tipo; o.frequency.value = freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq+slide), ac.currentTime+dur);
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
}
const sTiro = ()=>som(880,.06,'square',.025,-400);
const sAcerto = ()=>som(220,.08,'triangle',.06,-120);
const sMorte = ()=>som(160,.2,'sawtooth',.06,-120);
const sColeta = ()=>som(1200,.08,'sine',.06,600);
const sDano = ()=>som(110,.25,'sawtooth',.12,-60);
const sNivel = ()=>{ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>som(f,.15,'triangle',.08),i*90)); };

// ---------- DESENHO DO HERÓI ----------
// cores escolhidas para o desenho: cabelo castanho espetado, camiseta azul, calça escura, tênis vermelho
function desenhaHeroi(c, x, y, s, dir, passo, pisca){
  c.save(); c.translate(x, y); c.scale(s*dir, s);
  const lw = 2.2; c.lineWidth = lw; c.strokeStyle = '#1d1d1d'; c.lineJoin = 'round'; c.lineCap = 'round';
  const b = Math.sin(passo)*3;
  // sombra
  c.fillStyle='rgba(0,0,0,.15)'; c.beginPath(); c.ellipse(0,52,20,6,0,0,7); c.fill();
  // pernas
  c.fillStyle = '#2d3a5a';
  c.beginPath(); c.rect(-12, 14, 11, 32 + b); c.fill(); c.stroke();
  c.beginPath(); c.rect(1, 14, 11, 32 - b); c.fill(); c.stroke();
  // tênis
  c.fillStyle = '#e04a3a';
  c.beginPath(); c.ellipse(-8, 47 + b, 9, 5.5, 0, 0, 7); c.fill(); c.stroke();
  c.beginPath(); c.ellipse(8, 47 - b, 9, 5.5, 0, 0, 7); c.fill(); c.stroke();
  // braços
  c.fillStyle = '#3a7bd5';
  c.beginPath(); c.rect(-22, -16, 8, 30); c.fill(); c.stroke();
  c.beginPath(); c.rect(14, -16, 8, 30); c.fill(); c.stroke();
  // corpo (camiseta)
  c.beginPath(); c.roundRect(-16, -20, 32, 36, 5); c.fill(); c.stroke();
  // mangas
  c.beginPath(); c.moveTo(-22,-6); c.lineTo(-14,-6); c.moveTo(14,-6); c.lineTo(22,-6); c.stroke();
  // cinto
  c.fillStyle='#1d1d1d'; c.fillRect(-16, 13, 32, 3);
  // mãos
  c.fillStyle = '#f6c9a0';
  for(const hx of [-18, 18]){ c.beginPath(); c.arc(hx, 18, 5.5, 0, 7); c.fill(); c.stroke(); }
  // cabeça grande
  c.beginPath();
  c.moveTo(-24,-62); c.lineTo(-24,-36); c.quadraticCurveTo(-22,-18,-6,-18); c.lineTo(10,-18);
  c.quadraticCurveTo(24,-20,24,-38); c.lineTo(24,-62); c.closePath(); c.fill(); c.stroke();
  // orelha
  c.beginPath(); c.arc(25,-42,5,-1.4,1.4); c.fill(); c.stroke();
  // olhos grandes
  c.fillStyle = '#fff';
  c.beginPath(); c.ellipse(-10,-46,7,pisca?1:9,0,0,7); c.fill(); c.stroke();
  c.beginPath(); c.ellipse(10,-46,7,pisca?1:9,0,0,7); c.fill(); c.stroke();
  if(!pisca){
    c.fillStyle='#1d1d1d';
    c.beginPath(); c.arc(-8,-45,3.5,0,7); c.fill();
    c.beginPath(); c.arc(12,-45,3.5,0,7); c.fill();
    c.fillStyle='#fff';
    c.beginPath(); c.arc(-7,-47,1.2,0,7); c.fill();
    c.beginPath(); c.arc(13,-47,1.2,0,7); c.fill();
  }
  // nariz e sorriso
  c.beginPath(); c.arc(1,-34,2.5,Math.PI*.6,Math.PI*1.6); c.stroke();
  c.beginPath(); c.arc(3,-29,5,.3,Math.PI-.3); c.stroke();
  // bochechas
  c.fillStyle='rgba(240,120,110,.35)';
  c.beginPath(); c.arc(-15,-32,4,0,7); c.fill(); c.beginPath(); c.arc(18,-32,4,0,7); c.fill();
  // cabelo espetado
  c.fillStyle = '#7a4a22';
  c.beginPath(); c.moveTo(-26,-58);
  const pontas = [[-30,-74],[-20,-66],[-18,-82],[-10,-70],[-4,-86],[2,-72],[10,-84],[14,-70],[22,-80],[24,-66],[32,-70],[27,-56]];
  for(const p of pontas) c.lineTo(p[0], p[1]);
  c.lineTo(27,-40); c.lineTo(23,-46); c.lineTo(22,-58);
  // franja em zigue-zague
  for(let i=0;i<8;i++){ c.lineTo(18 - i*6, -58 + (i%2?4:0)); }
  c.lineTo(-24,-52); c.closePath(); c.fill(); c.stroke();
  c.restore();
}
// prévia no menu
(function(){
  const pc = document.getElementById('heroiPrev').getContext('2d');
  let t=0;
  (function anima(){ t+=.08; pc.clearRect(0,0,150,200); desenhaHeroi(pc,75,118,1.45,1,t,(t%6)<.15); requestAnimationFrame(anima); })();
})();

// ---------- ESTADO ----------
const INIMIGOS = [
  {e:'📚', hp:3, vel:1,   r:20, pts:10},
  {e:'✂️', hp:2, vel:1.5, r:16, pts:12},
  {e:'📐', hp:5, vel:.85, r:20, pts:15},
  {e:'📎', hp:2, vel:1.8, r:14, pts:14},
  {e:'🧮', hp:12,vel:.6,  r:28, pts:40},
];
let estado = 'menu', heroi, inimigos, tiros, itens, parts, textos, manchas, tempo, pontos, spawnT, tremor, teclas = {}, joy = null, ultimo = 0;

function novoJogo(){
  heroi = {x:W/2, y:H/2, r:22, vel:200, hp:100, hpMax:100, dano:1, cad:.55, cdTiro:0, multi:1, xp:0, nivel:1, prox:5, dir:1, passo:0, inv:0};
  inimigos=[]; tiros=[]; itens=[]; parts=[]; textos=[]; tempo=0; pontos=0; spawnT=0; tremor=0;
  manchas = [];
  for(let i=0;i<10;i++) manchas.push({x:Math.random()*W, y:Math.random()*H, e:['✏️','🖍️','📏','🔖','⭐'][i%5], a:Math.random()*6, s:22+Math.random()*12});
}

// ---------- ENTRADA ----------
addEventListener('keydown', e=>{ teclas[e.key.toLowerCase()] = true; });
addEventListener('keyup', e=>{ teclas[e.key.toLowerCase()] = false; });
cv.addEventListener('pointerdown', e=>{ if(estado!=='jogo') return; joy = {id:e.pointerId, bx:e.clientX, by:e.clientY, x:e.clientX, y:e.clientY}; });
cv.addEventListener('pointermove', e=>{ if(joy && e.pointerId===joy.id){ joy.x=e.clientX; joy.y=e.clientY; } });
const soltar = e=>{ if(joy && e.pointerId===joy.id) joy=null; };
cv.addEventListener('pointerup', soltar); cv.addEventListener('pointercancel', soltar);

// ---------- UTILIDADES ----------
const dist = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
function explode(x,y,cor,n=12){ for(let i=0;i<n;i++){ const a=Math.random()*7, v=60+Math.random()*180; parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,v:.5+Math.random()*.4,cor,r:2+Math.random()*4}); } }
function texto(x,y,t,cor){ textos.push({x,y,t,cor,v:.9}); }

function spawnInimigo(){
  const d = Math.floor(tempo/30);
  const disp = INIMIGOS.slice(0, Math.min(INIMIGOS.length, 2 + d));
  let tipo = disp[Math.floor(Math.random()*disp.length)];
  if(tipo.e==='🧮' && Math.random()<.6) tipo = INIMIGOS[0];
  const lado = Math.floor(Math.random()*4), m = 40;
  let x, y;
  if(lado===0){ x=Math.random()*W; y=-m; } else if(lado===1){ x=W+m; y=Math.random()*H; }
  else if(lado===2){ x=Math.random()*W; y=H+m; } else { x=-m; y=Math.random()*H; }
  const hp = tipo.hp * (1 + d*.35);
  inimigos.push({x,y,r:tipo.r,e:tipo.e,hp,hpMax:hp,vel:(52+d*10)*tipo.vel,pts:tipo.pts,flash:0,bal:Math.random()*7});
}

// ---------- MELHORIAS ----------
const MELHORIAS = [
  {ic:'✏️', nome:'Lápis afiado', desc:'+40% de dano', f:()=>heroi.dano*=1.4},
  {ic:'⚡', nome:'Mão rápida', desc:'Atira 25% mais rápido', f:()=>heroi.cad*=.75},
  {ic:'👟', nome:'Tênis novo', desc:'+15% de velocidade', f:()=>heroi.vel*=1.15},
  {ic:'🍎', nome:'Lanche reforçado', desc:'+30 vida máx. e cura', f:()=>{heroi.hpMax+=30; heroi.hp=heroi.hpMax;}},
  {ic:'✌️', nome:'Tiro duplo', desc:'+1 projétil por disparo', f:()=>heroi.multi++},
];
function subirNivel(){
  heroi.nivel++; heroi.xp -= heroi.prox; heroi.prox = Math.floor(heroi.prox*1.45 + 3);
  sNivel(); estado = 'nivel';
  const opc = [...MELHORIAS].sort(()=>Math.random()-.5).slice(0,3);
  const box = document.getElementById('cartas'); box.innerHTML='';
  for(const m of opc){
    const d = document.createElement('div'); d.className='carta';
    d.innerHTML = `<b>${m.ic}</b>${m.nome}<br><small>${m.desc}</small>`;
    d.onclick = ()=>{ m.f(); document.getElementById('nivel').classList.add('esconde'); estado='jogo'; ultimo=performance.now(); som(700,.1,'triangle',.08,300); };
    box.appendChild(d);
  }
  document.getElementById('nivel').classList.remove('esconde');
  joy = null;
}

function fimDeJogo(){
  estado='fim'; sMorte(); som(90,.8,'sawtooth',.12,-50);
  const m = Math.floor(tempo/60), s = Math.floor(tempo%60).toString().padStart(2,'0');
  document.getElementById('resumo').innerHTML = `Pontos: <b>${pontos}</b><br>Tempo: <b>${m}:${s}</b> · Nível: <b>${heroi.nivel}</b>`;
  document.getElementById('fim').classList.remove('esconde');
}

// ---------- ATUALIZA ----------
function atualiza(dt){
  tempo += dt;
  const d = Math.floor(tempo/30);
  // movimento
  let mx = 0, my = 0;
  if(teclas['a']||teclas['arrowleft']) mx--; if(teclas['d']||teclas['arrowright']) mx++;
  if(teclas['w']||teclas['arrowup']) my--; if(teclas['s']||teclas['arrowdown']) my++;
  if(joy){ const dx=joy.x-joy.bx, dy=joy.y-joy.by, l=Math.hypot(dx,dy); if(l>8){ mx=dx/Math.max(l,50); my=dy/Math.max(l,50); } }
  const ml = Math.hypot(mx,my); if(ml>1){ mx/=ml; my/=ml; }
  heroi.x = Math.max(25, Math.min(W-25, heroi.x + mx*heroi.vel*dt));
  heroi.y = Math.max(60, Math.min(H-50, heroi.y + my*heroi.vel*dt));
  if(mx) heroi.dir = mx>0?1:-1;
  if(ml>0.05) heroi.passo += dt*14; else heroi.passo *= .8;
  heroi.inv = Math.max(0, heroi.inv-dt);

  // spawn em ondas
  spawnT -= dt;
  if(spawnT<=0){
    const qtd = 1 + Math.floor(d/2) + (Math.random()<.25?1:0);
    for(let i=0;i<qtd;i++) spawnInimigo();
    spawnT = Math.max(.35, 1.3 - d*.18);
  }

  // tiro automático no mais próximo
  heroi.cdTiro -= dt;
  if(heroi.cdTiro<=0 && inimigos.length){
    let alvo=null, md=1e9;
    for(const e of inimigos){ const dd=dist(e,heroi); if(dd<md){md=dd;alvo=e;} }
    if(md < 520){
      const ang = Math.atan2(alvo.y-(heroi.y-10), alvo.x-heroi.x);
      for(let i=0;i<heroi.multi;i++){
        const a = ang + (i-(heroi.multi-1)/2)*.16;
        tiros.push({x:heroi.x, y:heroi.y-10, vx:Math.cos(a)*520, vy:Math.sin(a)*520, v:1.2, a});
      }
      heroi.cdTiro = heroi.cad; sTiro();
    }
  }

  // tiros
  for(const t of tiros){ t.x+=t.vx*dt; t.y+=t.vy*dt; t.v-=dt;
    for(const e of inimigos){ if(e.hp>0 && Math.hypot(e.x-t.x,e.y-t.y)<e.r+5){
      e.hp -= heroi.dano; e.flash=.1; t.v=0; sAcerto();
      e.x -= Math.cos(t.a)*-8; e.y -= Math.sin(t.a)*-8;
      explode(t.x,t.y,'#555',4);
      break; } } }
  tiros = tiros.filter(t=>t.v>0);

  // inimigos
  for(const e of inimigos){
    const a = Math.atan2(heroi.y-e.y, heroi.x-e.x);
    e.bal += dt*8;
    e.x += Math.cos(a)*e.vel*dt; e.y += Math.sin(a)*e.vel*dt;
    e.flash = Math.max(0, e.flash-dt);
    if(e.hp<=0) continue;
    if(dist(e,heroi) < e.r+heroi.r-4 && heroi.inv<=0){
      heroi.hp -= 10 + d*2; heroi.inv = .7; tremor = .35; sDano();
      explode(heroi.x,heroi.y,'#e04a3a',14);
      texto(heroi.x, heroi.y-70, 'Ai!', '#e04a3a');
      if(heroi.hp<=0){ heroi.hp=0; fimDeJogo(); return; }
    }
  }
  // separação simples
  for(let i=0;i<inimigos.length;i++) for(let j=i+1;j<inimigos.length;j++){
    const p=inimigos[i], q=inimigos[j], dx=q.x-p.x, dy=q.y-p.y, l=Math.hypot(dx,dy)||1, m=p.r+q.r;
    if(l<m){ const o=(m-l)/2/l; p.x-=dx*o; p.y-=dy*o; q.x+=dx*o; q.y+=dy*o; }
  }
  // mortos
  for(const e of inimigos) if(e.hp<=0){
    pontos += e.pts; sMorte();
    explode(e.x,e.y,['#1d3b8f','#f2b631','#e04a3a','#333'][Math.floor(Math.random()*4)],18);
    const n = e.e==='🧮'?5:1;
    for(let k=0;k<n;k++) itens.push({x:e.x+(Math.random()-.5)*20*k, y:e.y+(Math.random()-.5)*20*k, t:0});
    texto(e.x, e.y-20, '+'+e.pts, '#1d3b8f');
  }
  inimigos = inimigos.filter(e=>e.hp>0);

  // estrelinhas (xp)
  for(const it of itens){
    it.t += dt;
    const dd = dist(it,heroi);
    if(dd<130){ const a=Math.atan2(heroi.y-it.y, heroi.x-it.x); it.x+=Math.cos(a)*420*dt; it.y+=Math.sin(a)*420*dt; }
    if(dd<28){ it.pego=true; heroi.xp++; pontos+=2; sColeta(); }
  }
  itens = itens.filter(i=>!i.pego);
  if(heroi.xp >= heroi.prox) subirNivel();

  for(const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.92; p.vy*=.92; p.v-=dt; }
  parts = parts.filter(p=>p.v>0);
  for(const t of textos){ t.y-=40*dt; t.v-=dt; }
  textos = textos.filter(t=>t.v>0);
  tremor = Math.max(0, tremor-dt);
}

// ---------- DESENHA ----------
function folha(){
  ctx.fillStyle = '#fbf8ef'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = '#b9cde8'; ctx.lineWidth = 1.5;
  for(let y=50; y<H; y+=32){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.strokeStyle = '#e79a9a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(70,0); ctx.lineTo(70,H); ctx.stroke();
  ctx.fillStyle='#e8e2d2';
  for(let y=80;y<H;y+=110){ ctx.beginPath(); ctx.arc(30,y,9,0,7); ctx.fill(); }
  ctx.globalAlpha = .28;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const m of manchas){ ctx.save(); ctx.translate(m.x,m.y); ctx.rotate(m.a); ctx.font=m.s+'px serif'; ctx.fillText(m.e,0,0); ctx.restore(); }
  ctx.globalAlpha = 1;
}

function desenha(){
  ctx.save();
  if(tremor>0) ctx.translate((Math.random()-.5)*16*tremor/.35, (Math.random()-.5)*16*tremor/.35);
  folha();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  // itens
  for(const it of itens){ ctx.font = (20+Math.sin(it.t*6)*3)+'px serif'; ctx.fillText('⭐', it.x, it.y); }
  // inimigos
  for(const e of inimigos){
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(Math.sin(e.bal)*.15);
    ctx.fillStyle='rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(0,e.r*.9,e.r*.8,e.r*.25,0,0,7); ctx.fill();
    ctx.font = (e.r*2)+'px serif';
    if(e.flash>0){ ctx.globalAlpha=.5; }
    ctx.fillText(e.e, 0, 0);
    ctx.restore();
    if(e.hp<e.hpMax){ ctx.fillStyle='#ddd'; ctx.fillRect(e.x-e.r, e.y-e.r-10, e.r*2, 4); ctx.fillStyle='#e04a3a'; ctx.fillRect(e.x-e.r, e.y-e.r-10, e.r*2*e.hp/e.hpMax, 4); }
  }
  // tiros (bolinhas de grafite)
  for(const t of tiros){
    ctx.fillStyle='#333'; ctx.beginPath(); ctx.arc(t.x,t.y,5,0,7); ctx.fill();
    ctx.strokeStyle='rgba(50,50,50,.3)'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(t.x,t.y); ctx.lineTo(t.x-t.vx*.03,t.y-t.vy*.03); ctx.stroke();
  }
  // herói
  if(!(heroi.inv>0 && Math.floor(heroi.inv*20)%2)) desenhaHeroi(ctx, heroi.x, heroi.y, .75, heroi.dir, heroi.passo, (tempo%4)<.12);
  // partículas
  for(const p of parts){ ctx.globalAlpha=Math.min(1,p.v*2); ctx.fillStyle=p.cor; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
  for(const t of textos){ ctx.globalAlpha=Math.min(1,t.v*2); ctx.fillStyle=t.cor; ctx.font='bold 20px "Comic Sans MS",sans-serif'; ctx.fillText(t.t,t.x,t.y); }
  ctx.globalAlpha=1;
  ctx.restore();

  // joystick
  if(joy){
    ctx.strokeStyle='rgba(29,59,143,.4)'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(joy.bx,joy.by,50,0,7); ctx.stroke();
    const dx=joy.x-joy.bx, dy=joy.y-joy.by, l=Math.min(50,Math.hypot(dx,dy)), a=Math.atan2(dy,dx);
    ctx.fillStyle='rgba(29,59,143,.45)'; ctx.beginPath(); ctx.arc(joy.bx+Math.cos(a)*l, joy.by+Math.sin(a)*l, 22, 0, 7); ctx.fill();
  }

  // HUD
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle='#fff'; ctx.strokeStyle='#1d1d1d'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.roundRect(14,12,220,22,8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = heroi.hp/heroi.hpMax>.3 ? '#4cbf5a' : '#e04a3a';
  ctx.beginPath(); ctx.roundRect(16,14,216*heroi.hp/heroi.hpMax,18,6); ctx.fill();
  ctx.fillStyle='#1d1d1d'; ctx.font='bold 14px "Comic Sans MS",sans-serif';
  ctx.fillText(`❤ ${Math.ceil(heroi.hp)}/${heroi.hpMax}`, 24, 15);
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.roundRect(14,40,220,12,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#f2b631'; ctx.beginPath(); ctx.roundRect(16,42,216*Math.min(1,heroi.xp/heroi.prox),8,4); ctx.fill();
  ctx.fillStyle='#1d3b8f'; ctx.font='bold 18px "Comic Sans MS",sans-serif';
  ctx.fillText(`Nível ${heroi.nivel}`, 244, 14);
  ctx.textAlign='right';
  const m=Math.floor(tempo/60), s=Math.floor(tempo%60).toString().padStart(2,'0');
  ctx.font='bold 22px "Comic Sans MS",sans-serif';
  ctx.fillText(`⭐ ${pontos}`, W-16, 12);
  ctx.font='bold 16px "Comic Sans MS",sans-serif';
  ctx.fillText(`⏱ ${m}:${s} · Onda ${Math.floor(tempo/30)+1}`, W-16, 40);
}

function loop(agora){
  const dt = Math.min(.05, (agora-ultimo)/1000); ultimo = agora;
  if(estado==='jogo') atualiza(dt);
  if(heroi && estado!=='menu') desenha();
  requestAnimationFrame(loop);
}

function comecar(){
  if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
  ac.resume();
  novoJogo(); estado='jogo'; ultimo=performance.now();
  document.getElementById('menu').classList.add('esconde');
  document.getElementById('fim').classList.add('esconde');
  som(523,.12,'triangle',.08); setTimeout(()=>som(784,.15,'triangle',.08),100);
}
document.getElementById('btnJogar').onclick = comecar;
document.getElementById('btnDeNovo').onclick = comecar;
requestAnimationFrame(loop);
</script>
