<!doctype html>
<html lang="pt-BR">
<head>

<title>Litoral Neon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1430;--pink:#ff4f9a;--yel:#ffd166;--cy:#5ff3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#140c24;font-family:Rubik,system-ui,sans-serif;color:#fff;user-select:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
.chip{display:flex;align-items:center;gap:10px;background:rgba(29,20,48,.72);border:3px solid var(--ink);border-radius:14px;padding:4px 16px 4px 8px;font-weight:900;font-size:30px;text-shadow:0 3px 0 var(--ink)}
.chip svg{width:40px;height:40px}
#tl{position:absolute;top:18px;left:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#money{color:#7dffa8}
#tr{position:absolute;top:16px;right:20px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#stars{display:flex;gap:2px}
#stars svg{width:46px;height:46px}
#stars.flash{animation:fl .5s steps(2) infinite}
@keyframes fl{50%{opacity:.35}}
#bust{width:230px;height:16px;border:3px solid var(--ink);border-radius:10px;background:rgba(29,20,48,.7);overflow:hidden;display:none}
#bustF{height:100%;width:0;background:linear-gradient(90deg,#ff3355,#5b7bff)}
#bustL{font-family:Bungee;font-size:16px;color:#ff8aa0;text-shadow:2px 2px 0 var(--ink);display:none}
#mmW{position:absolute;left:22px;bottom:22px;width:236px;height:236px;border-radius:50%;border:5px solid var(--ink);box-shadow:0 0 0 4px var(--pink),0 10px 30px rgba(0,0,0,.4);overflow:hidden;background:#1b2a3a}
#spdW{position:absolute;right:30px;bottom:24px;text-align:right;display:none}
#spd{font-family:Bungee;font-size:70px;line-height:.95;text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--ink)}
#spdU{font-family:Bungee;font-size:20px;color:var(--yel);text-shadow:2px 2px 0 var(--ink)}
#radio{margin-top:8px;font-weight:900;font-size:18px;color:var(--cy);text-shadow:2px 2px 0 var(--ink);letter-spacing:1px}
#zone{position:absolute;right:30px;bottom:200px;font-family:Bungee;font-size:34px;color:var(--yel);text-shadow:3px 3px 0 var(--ink);opacity:0;transition:opacity .6s}
#mis{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(29,20,48,.78);border:3px solid var(--ink);border-radius:16px;padding:8px 26px 10px;text-align:center;min-width:380px;display:none;box-shadow:0 6px 0 rgba(0,0,0,.25)}
#mT{font-family:Bungee;font-size:22px;letter-spacing:1px}
#mO{font-size:21px;font-weight:700;margin-top:2px}
#mC{font-family:Bungee;font-size:34px;color:var(--yel);text-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:8px}
#mC svg{width:30px;height:30px}
#prompt{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(29,20,48,.82);border:3px solid var(--ink);border-radius:14px;padding:8px 18px;font-size:22px;font-weight:700;display:none;white-space:nowrap}
.k{display:inline-block;background:var(--yel);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:0 9px;margin-right:8px;font-family:Bungee;font-size:18px}
#cross{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
#ban{position:absolute;top:24%;left:0;right:0;text-align:center;opacity:0;transform:scale(.85);transition:opacity .35s,transform .35s}
#ban.on{opacity:1;transform:scale(1)}
#banT{font-family:Bungee;font-size:84px;text-shadow:4px 4px 0 var(--ink),9px 9px 0 rgba(0,0,0,.3)}
#banS{font-size:28px;font-weight:900;text-shadow:2px 2px 0 var(--ink)}
#toast{position:absolute;left:22px;bottom:285px;background:rgba(29,20,48,.85);border:3px solid var(--ink);border-left:8px solid var(--yel);border-radius:12px;padding:8px 16px;font-size:21px;font-weight:700;opacity:0;transition:opacity .3s;max-width:440px}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#title{background:linear-gradient(180deg,rgba(20,10,40,.15),rgba(20,10,40,.85))}
#logo{font-family:Bungee;font-size:112px;line-height:.9;background:linear-gradient(180deg,#ffe36e 10%,#ff5fa2 55%,#9b5cff 95%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(5px 5px 0 var(--ink)) drop-shadow(0 0 30px rgba(255,80,160,.5))}
#sub{font-size:24px;font-weight:700;margin:14px 0 26px;color:#ffe;text-shadow:2px 2px 0 var(--ink);max-width:760px}
.btn{font-family:Bungee;font-size:34px;color:var(--ink);background:var(--yel);border:4px solid var(--ink);border-radius:18px;padding:12px 50px;cursor:pointer;box-shadow:0 7px 0 var(--ink);transition:transform .1s}
.btn:hover{transform:translateY(-3px)}
.ctr{display:grid;grid-template-columns:auto auto auto auto;gap:10px 22px;margin-top:28px;font-size:18px;font-weight:700;text-align:left;background:rgba(29,20,48,.75);border:3px solid var(--ink);border-radius:16px;padding:18px 26px;align-items:center}
#pause{display:none;background:rgba(20,10,40,.7)}
#pause h1{font-family:Bungee;font-size:80px;margin:0 0 20px;color:var(--yel);text-shadow:5px 5px 0 var(--ink)}
</style>
</head>
<body>
<div id="hud">
  <div id="tl">
    <div class="chip" id="money"><svg viewBox="0 0 48 48"><rect x="4" y="11" width="40" height="26" rx="5" fill="#5fd38a" stroke="#1d1430" stroke-width="3.5"/><circle cx="24" cy="24" r="7" fill="#c9f7d8" stroke="#1d1430" stroke-width="3"/><circle cx="11" cy="24" r="2.5" fill="#1d1430"/><circle cx="37" cy="24" r="2.5" fill="#1d1430"/></svg><span id="mv">$ 500</span></div>
    <div class="chip"><svg viewBox="0 0 48 48"><rect x="4" y="10" width="40" height="28" rx="5" fill="#ff8a3d" stroke="#1d1430" stroke-width="3.5"/><rect x="11" y="16" width="26" height="11" rx="5" fill="#fff3d6" stroke="#1d1430" stroke-width="3"/><circle cx="17" cy="21.5" r="3" fill="#1d1430"/><circle cx="31" cy="21.5" r="3" fill="#1d1430"/><path d="M14 38l3-6h14l3 6" fill="#ffd166" stroke="#1d1430" stroke-width="3" stroke-linejoin="round"/></svg><span id="fv">0/12</span></div>
  </div>
  <div id="tr"><div id="stars"></div><div id="bustL">SENDO DETIDO</div><div id="bust"><div id="bustF"></div></div></div>
  <div id="mis"><div id="mT"></div><div id="mO"></div><div id="mC"><svg viewBox="0 0 48 48"><circle cx="24" cy="26" r="17" fill="#fff3d6" stroke="#1d1430" stroke-width="4"/><path d="M24 16v10l7 5" stroke="#1d1430" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="19" y="3" width="10" height="6" rx="2" fill="#ff4f9a" stroke="#1d1430" stroke-width="3"/></svg><span id="mTm"></span></div></div>
  <div id="cross"></div>
  <div id="prompt"></div>
  <div id="ban"><div id="banT"></div><div id="banS"></div></div>
  <div id="toast"></div>
  <div id="zone"></div>
  <div id="mmW"><canvas id="mm" width="236" height="236"></canvas></div>
  <div id="spdW"><div id="spd">0</div><div id="spdU">KM/H</div><div id="radio"></div></div>
</div>

<div class="ov" id="title">
  <svg width="180" height="124" viewBox="0 0 180 124"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe36e"/><stop offset="1" stop-color="#ff4f9a"/></linearGradient><clipPath id="cp"><circle cx="80" cy="66" r="48"/></clipPath></defs><circle cx="80" cy="66" r="48" fill="url(#sg)"/><g clip-path="url(#cp)" fill="#2a1650"><rect x="20" y="76" width="120" height="5"/><rect x="20" y="89" width="120" height="7"/><rect x="20" y="103" width="120" height="10"/></g><circle cx="80" cy="66" r="48" fill="none" stroke="#1d1430" stroke-width="5"/><path d="M138 118 C135 92 132 72 122 52" stroke="#1d1430" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M122 52 q-24 -6 -38 10 M122 52 q-8 -24 -32 -26 M122 52 q12 -22 36 -18 M122 52 q26 0 36 20" stroke="#2fa35a" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M122 52 q-24 -6 -38 10 M122 52 q-8 -24 -32 -26 M122 52 q12 -22 36 -18 M122 52 q26 0 36 20" stroke="#1d1430" stroke-width="3" fill="none" stroke-linecap="round" opacity=".5"/><rect x="12" y="114" width="156" height="7" rx="3.5" fill="#1d1430"/></svg>
  <div id="logo">LITORAL<br>NEON</div>
  <div id="sub">Mundo aberto em primeira pessoa na cidade de Maresia. Faça missões, encontre as 12 fitas escondidas e despiste a polícia.</div>
  <button class="btn" id="play">JOGAR</button>
  <div class="ctr"></div>
</div>
<div class="ov" id="pause"><h1>PAUSADO</h1><button class="btn" id="cont">CONTINUAR</button><div class="ctr"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v, pick=a=>a[Math.floor(Math.random()*a.length)];
const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));

/* ================= RENDER BASE ================= */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.setSize(innerWidth,innerHeight);
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1500);
scene.fog=new THREE.Fog(0xff9a70,140,620);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const hemi=new THREE.HemisphereLight(0xfff0dd,0x556070,0.8);scene.add(hemi);
const sunL=new THREE.DirectionalLight(0xffe0b0,0.8);scene.add(sunL);
const lam=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));
const basic=(c,o)=>new THREE.MeshBasicMaterial(Object.assign({color:c},o||{}));
const matCache={};const cmat=c=>matCache[c]||(matCache[c]=lam(c));
const dummy=new THREE.Object3D();

// ceu
const skyU={top:{value:new THREE.Color()},bot:{value:new THREE.Color()}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(1200,32,16),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform vec3 top;uniform vec3 bot;varying vec3 vP;void main(){float h=clamp(vP.y*2.2+0.05,0.0,1.0);gl_FragColor=vec4(mix(bot,top,pow(h,0.8)),1.0);}'}));
sky.renderOrder=-2;sky.frustumCulled=false;scene.add(sky);
const sunM=new THREE.Mesh(new THREE.SphereGeometry(42,20,10),basic(0xffd27a,{fog:false}));scene.add(sunM);
const moonM=new THREE.Mesh(new THREE.SphereGeometry(22,16,8),basic(0xeef0ff,{fog:false}));scene.add(moonM);
const starGeo=new THREE.BufferGeometry();{const a=[];for(let i=0;i<500;i++){const t=Math.random()*Math.PI*2,p=Math.random()*1.3;a.push(Math.cos(t)*Math.cos(p)*1100,Math.sin(p)*1100+40,Math.sin(t)*Math.cos(p)*1100);}starGeo.setAttribute('position',new THREE.Float32BufferAttribute(a,3));}
const starPts=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:2,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false}));starPts.frustumCulled=false;scene.add(starPts);

/* ================= TEXTURAS ================= */
function canvasTex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t;}
const winRects=[];for(let i=0;i<4;i++)for(let j=0;j<4;j++)winRects.push([i*64+12,j*64+14,40,34]);
const winTex=canvasTex(256,256,g=>{g.fillStyle='#fff';g.fillRect(0,0,256,256);g.fillStyle='rgba(0,0,0,.08)';for(let j=0;j<4;j++)g.fillRect(0,j*64+54,256,5);
  for(const r of winRects){g.fillStyle='#3d4d66';g.fillRect(...r);g.fillStyle='rgba(255,255,255,.25)';g.fillRect(r[0]+3,r[1]+3,10,r[3]-6);}});
const winEm=canvasTex(256,256,g=>{g.fillStyle='#000';g.fillRect(0,0,256,256);for(const r of winRects)if(Math.random()<.6){g.fillStyle=pick(['#ffd27a','#ffe9b0','#ffb36b','#9fe8ff']);g.fillRect(...r);}});
function roadTex(v){return canvasTex(128,128,(g,w,h)=>{g.fillStyle='#3b3a44';g.fillRect(0,0,w,h);
  for(let i=0;i<500;i++){g.fillStyle=`rgba(255,255,255,${Math.random()*.06})`;g.fillRect(Math.random()*w,Math.random()*h,2,2);}
  g.fillStyle='#f5c542';v?g.fillRect(60,0,8,64):g.fillRect(0,60,64,8);
  g.fillStyle='#e8e8e8';if(v){g.fillRect(5,0,4,h);g.fillRect(w-9,0,4,h);}else{g.fillRect(0,5,w,4);g.fillRect(0,h-9,w,4);}});}
const poolTex=canvasTex(128,128,g=>{const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,240,190,1)');gr.addColorStop(1,'rgba(255,240,190,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);});

/* ================= CIDADE ================= */
const N=8,CELL=80,ROAD=16,HALF=N*CELL/2,SPAN=N*CELL+ROAD;
const rc=i=>-HALF+i*CELL;
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
const inR=(i,j)=>i>=0&&i<=N&&j>=0&&j<=N;
const solids=[],blocks=[],foot=[];
const addSolid=(x,z,w,d)=>solids.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2});

const ground=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),lam(0x86a865));ground.rotation.x=-Math.PI/2;ground.position.y=-0.05;scene.add(ground);
const tH=roadTex(false),tV=roadTex(true);tH.repeat.set(SPAN/ROAD,1);tV.repeat.set(1,SPAN/ROAD);
const mRH=lam(0xffffff,{map:tH}),mRV=lam(0xffffff,{map:tV});
for(let i=0;i<=N;i++){
  const h=new THREE.Mesh(new THREE.PlaneGeometry(SPAN,ROAD),mRH);h.rotation.x=-Math.PI/2;h.position.set(0,0.02,rc(i));scene.add(h);
  const v=new THREE.Mesh(new THREE.PlaneGeometry(ROAD,SPAN),mRV);v.rotation.x=-Math.PI/2;v.position.set(rc(i),0.03,0);scene.add(v);
}
{const ix=new THREE.InstancedMesh(new THREE.PlaneGeometry(ROAD,ROAD),lam(0x3b3a44),(N+1)*(N+1));let k=0;
 for(let i=0;i<=N;i++)for(let j=0;j<=N;j++){dummy.position.set(rc(i),0.04,rc(j));dummy.rotation.set(-Math.PI/2,0,0);dummy.updateMatrix();ix.setMatrixAt(k++,dummy.matrix);}
 dummy.rotation.set(0,0,0);scene.add(ix);}

function buildingGeo(w,h,d){const g=new THREE.BoxGeometry(w,h,d),uv=g.attributes.uv,dims=[[d,h],[d,h],[0,0],[0,0],[w,h],[w,h]];
  for(let f=0;f<6;f++)for(let k=0;k<4;k++){const i=f*4+k;uv.setXY(i,uv.getX(i)*dims[f][0]/16,uv.getY(i)*dims[f][1]/14);}return g;}
const BCOL=[0xf7a8c6,0x82dccf,0xf6e7c9,0xc3b0f4,0xffa48c,0xf2f2ec,0x9fcbff,0xffd58f];
const bMats=BCOL.map(c=>lam(c,{map:winTex,emissive:0xffffff,emissiveMap:winEm,emissiveIntensity:0}));
const NEON=[0xff3d9a,0x3df5ff,0xffe14d,0xb46bff,0x5dff9a];
const neonList=[],palmSpots=[],parks=[];
const palm=(x,z,solid)=>{palmSpots.push([x,z,rand(-0.14,0.14),rand(0,6)]);if(solid)addSolid(x,z,1.2,1.2);};
const sw=new THREE.InstancedMesh(new THREE.BoxGeometry(64,0.22,64),lam(0xd3ccbf),N*N);
let bk=0;
for(let bi=0;bi<N;bi++)for(let bj=0;bj<N;bj++){
  const cx=rc(bi)+CELL/2,cz=rc(bj)+CELL/2;
  dummy.position.set(cx,0.11,cz);dummy.updateMatrix();sw.setMatrixAt(bk++,dummy.matrix);
  const park=(bi===3&&bj===4)||(bi===N-1&&bj===1)||(bi!==N-1&&Math.random()<0.09);
  blocks.push({cx,cz,park});
  if(park){parks.push([cx,cz]);for(const [ox,oz] of [[-17,-17],[17,-17],[-17,17],[17,17],[0,-20],[0,20]])palm(cx+ox,cz+oz,true);addSolid(cx,cz,9,9);continue;}
  const dc=Math.hypot(cx,cz)/HALF;
  const lots=Math.random()<0.25?[[0,0,54]]:[[-14,-14,26],[14,-14,26],[-14,14,26],[14,14,26]];
  for(const [ox,oz,s] of lots){
    if(lots.length>1&&Math.random()<0.1)continue;
    const w=s*rand(.78,1),d=s*rand(.78,1);
    let h=bi===N-1?rand(28,72):rand(8,22)+Math.max(0,1-dc)*rand(10,75);
    if(lots.length===1)h*=1.15;
    h=Math.max(7,Math.round(h/3.5)*3.5);
    const m=new THREE.Mesh(buildingGeo(w,h,d),pick(bMats));m.position.set(cx+ox,h/2+0.2,cz+oz);scene.add(m);
    addSolid(cx+ox,cz+oz,w,d);foot.push([cx+ox-w/2,cz+oz-d/2,w,d]);
    if(Math.random()<.4)neonList.push([cx+ox,h-0.4,cz+oz,w+0.35,0.7,d+0.35,pick(NEON)]);
    if(Math.random()<.25)neonList.push([cx+ox,h*0.5,cz+oz,w+0.3,0.35,d+0.3,pick(NEON)]);
  }
}
scene.add(sw);
{const neon=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),basic(0xffffff),neonList.length);const col=new THREE.Color();
 neonList.forEach((n,i)=>{dummy.position.set(n[0],n[1],n[2]);dummy.scale.set(n[3],n[4],n[5]);dummy.updateMatrix();neon.setMatrixAt(i,dummy.matrix);neon.setColorAt(i,col.setHex(n[6]));});
 dummy.scale.set(1,1,1);scene.add(neon);}
// parques e fontes
{const grass=new THREE.InstancedMesh(new THREE.BoxGeometry(58,0.3,58),lam(0x6fbf5a),parks.length);
 const basin=new THREE.InstancedMesh(new THREE.CylinderGeometry(4.2,4.6,0.9,20),lam(0xf2efe6),parks.length);
 const water=new THREE.InstancedMesh(new THREE.CylinderGeometry(3.7,3.7,0.1,20),basic(0x4fd8ff),parks.length);
 parks.forEach(([x,z],i)=>{dummy.position.set(x,0.15,z);dummy.updateMatrix();grass.setMatrixAt(i,dummy.matrix);dummy.position.y=0.6;dummy.updateMatrix();basin.setMatrixAt(i,dummy.matrix);dummy.position.y=1.06;dummy.updateMatrix();water.setMatrixAt(i,dummy.matrix);});
 scene.add(grass,basin,water);}
// praia e mar
const sand=new THREE.Mesh(new THREE.PlaneGeometry(110,1000),lam(0xf3dca4));sand.rotation.x=-Math.PI/2;sand.position.set(383,0.01,0);scene.add(sand);
const oceanM=lam(0x2bb7cc);const ocean=new THREE.Mesh(new THREE.PlaneGeometry(2400,3000),oceanM);ocean.rotation.x=-Math.PI/2;ocean.position.set(1612,0.06,0);scene.add(ocean);
const foam=new THREE.Mesh(new THREE.PlaneGeometry(3,1000),basic(0xffffff,{transparent:true,opacity:.75}));foam.rotation.x=-Math.PI/2;foam.position.set(412,0.08,0);scene.add(foam);
addSolid(1000,0,1160,4000);addSolid(-1000,0,1160,4000);addSolid(0,-1000,4000,1160);addSolid(0,1000,4000,1160);
for(let z=-400;z<=400;z+=22)palm(345+rand(-3,3),z,true);
for(let z=-390;z<=390;z+=40)palm(402+rand(-2,2),z+rand(-6,6),true);
{const pole=new THREE.CylinderGeometry(0.08,0.08,3,6),cone=new THREE.ConeGeometry(2.6,1.1,10),UC=[0xff4f9a,0xffd166,0x4ff0ff,0xffffff,0x9b5cff];
 for(let k=0;k<18;k++){const x=rand(360,396),z=rand(-390,390);const p=new THREE.Mesh(pole,cmat(0xeeeeee));p.position.set(x,1.5,z);const c=new THREE.Mesh(cone,cmat(pick(UC)));c.position.set(x,3.2,z);scene.add(p,c);
  const t=new THREE.Mesh(new THREE.PlaneGeometry(1.4,2.6),cmat(pick(UC)));t.rotation.set(-Math.PI/2,0,rand(0,3));t.position.set(x+1.5,0.03,z);scene.add(t);}}
// palmeiras (instanciadas)

  if(cut){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);fl.connect(g);}else o.connect(g);

function collideSolids(o,r){let n=null;
  for(const s of solids){if(o.x+r<s.x0||o.x-r>s.x1||o.z+r<s.z0||o.z-r>s.z1)continue;
    const cx=clamp(o.x,s.x0,s.x1),cz=clamp(o.z,s.z0,s.z1);let dx=o.x-cx,dz=o.z-cz;const d2=dx*dx+dz*dz;if(d2>=r*r)continue;
    if(d2<1e-8){const l=o.x-s.x0,rr=s.x1-o.x,t=o.z-s.z0,b=s.z1-o.z,m=Math.min(l,rr,t,b);
      if(m===l){o.x=s.x0-r;n=[-1,0];}else if(m===rr){o.x=s.x1+r;n=[1,0];}else if(m===t){o.z=s.z0-r;n=[0,-1];}else{o.z=s.z1+r;n=[0,1];}}
    else{const d=Math.sqrt(d2);dx/=d;dz/=d;o.x=cx+dx*r;o.z=cz+dz*r;n=[dx,dz];}}
  return n;}
function carPhysics(c,thr,brk,steerIn,hb,dt){
  if(thr)c.spd+=(c.spd<0?30:c.accel)*dt;
  if(brk)c.spd-=(c.spd>0?32:14)*dt;
  if(!thr&&!brk)c.spd-=Math.sign(c.spd)*Math.min(Math.abs(c.spd),4*dt);
  if(hb)c.spd-=Math.sign(c.spd)*Math.min(Math.abs(c.spd),20*dt);
  c.spd=clamp(c.spd,-11,c.max);
  c.steer+=(steerIn-c.steer)*Math.min(1,dt*7);
  const as=Math.abs(c.spd);
  c.h+=c.steer*Math.min(1,as/5)*(1.8-Math.min(1,as/50))*Math.sign(c.spd)*(hb?1.7:1)*dt;
  c.x+=Math.sin(c.h)*c.spd*dt;c.z+=Math.cos(c.h)*c.spd*dt;
  const n=collideSolids(c,1.9);
  if(n){const dot=Math.sin(c.h)*n[0]+Math.cos(c.h)*n[1],imp=Math.abs(dot*c.spd);c.spd*=1-Math.abs(dot)*0.85;
    if(c===player.car&&imp>6){shake=Math.min(1,imp/25);crashSnd(imp);}}
}
function carCollisions(){
  for(let a=0;a<cars.length;a++){const A=cars[a];for(let b=a+1;b<cars.length;b++){const B=cars[b];
    const dx=B.x-A.x,dz=B.z-A.z;if(Math.abs(dx)>3.3||Math.abs(dz)>3.3)continue;const d=Math.hypot(dx,dz);if(d>=3.2||d<0.001)continue;
    const push=(3.2-d)/2,nx=dx/d,nz=dz/d;A.x-=nx*push;A.z-=nz*push;B.x+=nx*push;B.z+=nz*push;
    const pc=A===player.car?A:B===player.car?B:null;if(!pc)continue;const o=pc===A?B:A,rel=Math.abs(pc.spd-o.spd*Math.cos(pc.h-o.h));
    if(rel>4){pc.spd*=0.6;shake=Math.min(1,rel/20);crashSnd(rel);
      if((o.kind==='traffic'||o.kind==='police')&&wantedCD<=0&&state==='play'){addWanted(1);wantedCD=2.5;}
      if(o.kind==='traffic'){o.stun=2.5;o.spd=0;}}}}
}

function enterCar(c){player.car=c;c.kind='player';c.g.add(interior);player.look=0;player.pitch=0;sfx('door');
  $('spdW').style.display='block';$('cross').style.display='none';$('radio').textContent=STATIONS[stIdx].n;}
function exitCar(){const c=player.car;if(!c)return;c.kind='parked';c.spd=0;c.steer=0;c.g.remove(interior);player.car=null;
  player.x=c.x+Math.cos(c.h)*2.6;player.z=c.z-Math.sin(c.h)*2.6;player.yaw=c.h+Math.PI;player.pitch=0;player.y=0;sfx('door');
  $('spdW').style.display='none';$('cross').style.display='block';}
function toggleCar(){if(player.car){if(Math.abs(player.car.spd)<8)exitCar();}else{const c=nearCar();if(c)enterCar(c);}}
function updTraffic(c,dt){
  const [fx,fz]=DIRS[c.dir];let want=c.cruise;
  if(c.stun>0){c.stun-=dt;want=0;}
  else if(c.ignore>0)c.ignore-=dt;
  else{const chk=(ox,oz)=>{const dx=ox-c.x,dz=oz-c.z,al=dx*fx+dz*fz;if(al>0&&al<11&&Math.abs(-dx*fz+dz*fx)<2.6)want=Math.min(want,al<5?0:(al-5)*2);};
    for(const o of cars)if(o!==c&&o.kind!=='parked')chk(o.x,o.z);if(!player.car)chk(player.x,player.z);
    if(want<1){c.wait+=dt;if(c.wait>5){c.ignore=2.5;c.wait=0;}}else c.wait=0;}
  c.spd+=(want-c.spd)*Math.min(1,dt*3);c.t+=c.spd*dt;
  if(c.t>=CELL){c.t-=CELL;c.i+=fx;c.j+=fz;const opts=[];
    for(let d=0;d<4;d++){if(d===(c.dir+2)%4||!inR(c.i+DIRS[d][0],c.j+DIRS[d][1]))continue;opts.push(d);if(d===c.dir)opts.push(d,d);}
    c.dir=opts.length?pick(opts):(c.dir+2)%4;}
  const [tx,tz]=laneTarget(c),k=Math.min(1,dt*5);c.x+=(tx-c.x)*k;c.z+=(tz-c.z)*k;
  c.h+=wrapA(Math.atan2(DIRS[c.dir][0],DIRS[c.dir][1])-c.h)*Math.min(1,dt*5);
}
function placePolice(c){const [px,pz]=ppos();for(let k=0;k<60;k++){const x=rc(Math.floor(Math.random()*(N+1))),z=rc(Math.floor(Math.random()*(N+1))),d=Math.hypot(x-px,z-pz);
  if(d>90&&d<170){c.x=x;c.z=z;c.h=Math.atan2(px-x,pz-z);c.spd=10;c.stuckN=0;return true;}}return false;}
function spawnPolice(){const c=makeCar('police',0xffffff,0,0,0);c.max=41;c.accel=18;if(!placePolice(c))removeCar(c);}
function updPolice(c,dt){const [tx,tz]=ppos(),dx=tx-c.x,dz=tz-c.z,d=Math.hypot(dx,dz),diff=wrapA(Math.atan2(dx,dz)-c.h);
  let thr=d>7,brk=d<7&&c.spd>3,steer=clamp(diff*2.2,-1,1);
  if(c.rev>0){c.rev-=dt;thr=false;brk=true;steer=-steer;}
  else{if(Math.abs(c.spd)<2&&d>10)c.stuck+=dt;else c.stuck=Math.max(0,c.stuck-dt);if(c.stuck>1.2){c.rev=1.1;c.stuck=0;c.stuckN++;}}
  if(c.stuckN>3||d>260)placePolice(c);
  carPhysics(c,thr,brk,steer,false,dt);}
function updPed(p,dt){p.s+=p.spd*dt;const [tx,tz]=pedPath(p),c=player.car;
  if(c&&Math.abs(c.spd)>4){const dx=p.x-c.x,dz=p.z-c.z;if(dx*dx+dz*dz<100){const fx=Math.sin(c.h),fz=Math.cos(c.h);
    if(dx*fx+dz*fz>-2){const sg=(-dx*fz+dz*fx)>=0?1:-1;p.vx=-fz*sg*10;p.vz=fx*sg*10;if(p.hy<=0)p.hv=4.5;}}}
  p.x+=p.vx*dt;p.z+=p.vz*dt;const dm=Math.exp(-dt*3);p.vx*=dm;p.vz*=dm;
  const k=Math.min(1,dt*1.5);p.x+=(tx-p.x)*k;p.z+=(tz-p.z)*k;
  p.hv-=15*dt;p.hy+=p.hv*dt;if(p.hy<0){p.hy=0;p.hv=0;}
  collideSolids(p,0.4);}
function addWanted(n){const b=stars;stars=Math.min(5,stars+n);escapeT=0;if(stars!==b){renderStars();toast('A polícia está atrás de você');}}
function updWanted(dt){wantedCD-=dt;spawnCD-=dt;
  const pols=cars.filter(c=>c.kind==='police');
  if(stars>0&&pols.length<stars&&spawnCD<=0){spawnPolice();spawnCD=1.5;}
  if(stars===0&&pols.length)pols.forEach(removeCar);
  const [px,pz]=ppos();let near=1e9;for(const c of pols)near=Math.min(near,Math.hypot(c.x-px,c.z-pz));
  if(stars>0){
    if(near>85)escapeT+=dt;else escapeT=Math.max(0,escapeT-dt*2);
    $('stars').classList.toggle('flash',escapeT>0.5);
    if(escapeT>6+stars*2.5){stars=0;escapeT=0;renderStars();toast('Você despistou a polícia');sfx('cp');}
    const slow=!player.car||Math.abs(player.car.spd)<4;
    if(near<8&&slow)bustT+=dt;else bustT=Math.max(0,bustT-dt*1.5);
    if(bustT>2.6)busted();
  }else{bustT=0;$('stars').classList.remove('flash');}
  const show=bustT>0.05;$('bust').style.display=$('bustL').style.display=show?'block':'none';$('bustF').style.width=(bustT/2.6*100)+'%';}
function busted(){const fine=Math.max(100,Math.round(money*0.15/10)*10);money=Math.max(0,money-fine);
  if(player.car)exitCar();if(mission)endMission(false,'',true);
  player.x=rc(4)+10.5;player.z=rc(4)+10.5;player.yaw=Math.PI*0.75;
  stars=0;bustT=0;escapeT=0;renderStars();cars.filter(c=>c.kind==='police').forEach(removeCar);
  banner('DETIDO',`Multa de $ ${fine}. Liberado na delegacia.`,'#ff6b8a');sfx('fail');}
function randNode(x,z,a,b){let r=null;for(let k=0;k<80;k++){const i=Math.floor(Math.random()*(N+1)),j=Math.floor(Math.random()*(N+1)),d=Math.hypot(rc(i)-x,rc(j)-z);
  r={x:rc(i),z:rc(j)};if(d>=a&&d<=b)return r;}return r;}
const fmtT=t=>{t=Math.max(0,t);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');};
function startMission(gv){const [px,pz]=ppos();let cps=[],time=0,reward=0;
  if(gv.t==='entrega'){const a=randNode(px,pz,140,260),b=randNode(a.x,a.z,200,340);cps=[a,b];time=Math.round((Math.hypot(a.x-px,a.z-pz)+Math.hypot(b.x-a.x,b.z-a.z))/16+15);reward=600;}
  else if(gv.t==='corrida'){let i=clamp(Math.round((px+HALF)/CELL),0,N),j=clamp(Math.round((pz+HALF)/CELL),0,N),last=-1,tot=Math.hypot(rc(i)-px,rc(j)-pz);
    for(let k=0;k<6;k++){const opts=[0,1,2,3].filter(d=>(last<0||d!==(last+2)%4)&&inR(i+DIRS[d][0],j+DIRS[d][1]));const d=pick(opts);
      let st=1+Math.floor(Math.random()*2);while(st>1&&!inR(i+DIRS[d][0]*st,j+DIRS[d][1]*st))st--;i+=DIRS[d][0]*st;j+=DIRS[d][1]*st;last=d;cps.push({x:rc(i),z:rc(j)});tot+=st*CELL;}
    time=Math.round(tot/20+12);reward=900;}
  else{time=120;reward=1200;stars=Math.max(stars,3);escapeT=0;spawnCD=0;renderStars();}
  mission={gv,cps,idx:0,time,reward};givers.forEach(g=>g.beam.visible=false);
  $('mis').style.display='block';$('mT').textContent=gv.name;$('mT').style.color=gv.css;
  banner(gv.name,gv.t==='fuga'?'Despiste a polícia antes do tempo acabar':'Missão iniciada',gv.css);sfx('cp');setTarget();}
function setTarget(){const cp=mission.cps[mission.idx];if(!cp){tBeam.visible=false;return;}tBeam.visible=true;tBeam.position.set(cp.x,0,cp.z);tBeam.children.forEach(m=>m.material.color.setHex(mission.gv.col));}
function endMission(ok,why,silent){const m=mission;mission=null;misCD=6;tBeam.visible=false;$('mis').style.display='none';if(silent)return;
  if(ok){money+=m.reward;banner('MISSÃO CONCLUÍDA','+ $ '+m.reward.toLocaleString('pt-BR'),'#7dffa8');sfx('win');}
  else{banner('MISSÃO FALHOU',why,'#ff6b8a');sfx('fail');}}
function updMission(dt){const [px,pz]=ppos();misCD-=dt;
  if(!mission){let near=null;for(const g of givers){g.beam.visible=true;g.beam.rotation.y+=dt;if(Math.hypot(px-g.x,pz-g.z)<5)near=g;}
    if(near&&misCD<=0){if(player.car)startMission(near);else promptMsg=`<b style="color:${near.css}">${near.name}</b>: entre em um carro para começar`;}return;}
  mission.time-=dt;
  if(mission.gv.t==='fuga'){$('mO').textContent='Despiste a polícia';if(stars===0)return endMission(true);}
  else{const cp=mission.cps[mission.idx],d=Math.hypot(px-cp.x,pz-cp.z);
    if(d<8){mission.idx++;sfx('cp');if(mission.idx>=mission.cps.length)return endMission(true);setTarget();return;}
    const txt=mission.gv.t==='entrega'?(mission.idx===0?'Pegue a encomenda':'Entregue a encomenda'):`Checkpoint ${mission.idx+1} de ${mission.cps.length}`;
    $('mO').textContent=txt+'  ·  '+Math.round(d)+' m';}
  if(mission.time<=0)return endMission(false,'O tempo acabou');
  $('mTm').textContent=fmtT(mission.time);$('mC').style.color=mission.time<10?'#ff6b8a':'';}
function updFitas(dt){const [px,pz]=ppos(),r=player.car?4.5:2.8;
  for(const f of fitas){if(f.got)continue;f.g.rotation.y+=dt*2;f.g.position.y=1.4+Math.sin(tG*3+f.x)*0.25;
    if(Math.hypot(px-f.x,pz-f.z)<r){f.got=true;scene.remove(f.g);fitasGot++;money+=150;$('fv').textContent=fitasGot+'/12';sfx('coin');
      if(fitasGot===12){money+=2000;banner('COLEÇÃO COMPLETA','Todas as 12 fitas. Bônus de $ 2.000','#ffd166');sfx('win');}else toast('Fita encontrada  + $ 150');}}}

/* ================= HUD ================= */
const starSVG=on=>`<svg viewBox="0 0 48 48"><path d="M24 4l5.9 12.6 13.6 1.6-10 9.4 2.7 13.5L24 34.3 11.8 41.1l2.7-13.5-10-9.4 13.6-1.6z" fill="${on?'#ffd166':'rgba(255,255,255,.15)'}" stroke="#1d1430" stroke-width="3.5" stroke-linejoin="round"/></svg>`;
function renderStars(){if(starsShown===stars)return;starsShown=stars;let h='';for(let i=0;i<5;i++)h+=starSVG(i<stars);$('stars').innerHTML=h;}
function toast(s){$('toast').textContent=s;$('toast').style.opacity=1;toastT=3.5;}
function banner(t,s,col){$('banT').textContent=t;$('banT').style.color=col||'#ffd166';$('banS').textContent=s||'';$('ban').classList.add('on');banT=3.2;}
const zoneOf=(x,z)=>x>300?'ORLA NEON':x<-130?'VILA PALMEIRA':z<-130?'PORTO NORTE':z>130?'JARDIM SUL':'CENTRO';
let lastPrompt=null;
function updHud(dt){
  if(Math.round(shownMoney)!==money){shownMoney=shownMoney<0?money:shownMoney+(money-shownMoney)*Math.min(1,dt*6);if(Math.abs(money-shownMoney)<1)shownMoney=money;$('mv').textContent='$ '+Math.round(shownMoney).toLocaleString('pt-BR');}
  if(player.car)$('spd').textContent=Math.round(Math.abs(player.car.spd)*3.6);
  if(promptMsg!==lastPrompt){lastPrompt=promptMsg;$('prompt').innerHTML=promptMsg;$('prompt').style.display=promptMsg?'block':'none';}
  if(toastT>0&&(toastT-=dt)<=0)$('toast').style.opacity=0;
  if(banT>0&&(banT-=dt)<=0)$('ban').classList.remove('on');
  const [px,pz]=ppos(),z=zoneOf(px,pz);if(z!==zoneCur){zoneCur=z;$('zone').textContent=z;$('zone').style.opacity=1;zoneT=3;}
  if(zoneT>0&&(zoneT-=dt)<=0)$('zone').style.opacity=0;
  drawMap();}
const mm=$('mm').getContext('2d'),MS=236,MC=118,SC=0.5,fwdV=new THREE.Vector3();
function drawMap(){camera.getWorldDirection(fwdV);const th=-Math.PI/2-Math.atan2(fwdV.z,fwdV.x),co=Math.cos(th),si=Math.sin(th),[px,pz]=ppos();
  mm.setTransform(1,0,0,1,0,0);mm.fillStyle='#7c9a63';mm.fillRect(0,0,MS,MS);
  mm.setTransform(SC*co,SC*si,-SC*si,SC*co,MC-SC*(px*co-pz*si),MC-SC*(px*si+pz*co));
  mm.fillStyle='#f0d9a0';mm.fillRect(328,-500,84,1000);mm.fillStyle='#2a9fc0';mm.fillRect(412,-1500,2000,3000);
  for(const b of blocks){mm.fillStyle=b.park?'#5fae54':'#cfc8bb';mm.fillRect(b.cx-32,b.cz-32,64,64);}
  mm.fillStyle='#9d93b0';for(const f of foot)mm.fillRect(f[0],f[1],f[2],f[3]);
  mm.fillStyle='#45424e';for(let i=0;i<=N;i++){mm.fillRect(-SPAN/2,rc(i)-ROAD/2,SPAN,ROAD);mm.fillRect(rc(i)-ROAD/2,-SPAN/2,ROAD,SPAN);}
  mm.setTransform(1,0,0,1,0,0);
  const dot=(x,z,r,col,edge)=>{const dx=x-px,dz=z-pz;let sx=(dx*co-dz*si)*SC,sy=(dx*si+dz*co)*SC;const L=Math.hypot(sx,sy),R=MC-14;
    if(L>R){if(!edge)return;sx*=R/L;sy*=R/L;}mm.beginPath();mm.arc(MC+sx,MC+sy,r,0,Math.PI*2);mm.fillStyle=col;mm.fill();mm.lineWidth=3;mm.strokeStyle='#1d1430';mm.stroke();};
  if(!mission)givers.forEach(g=>dot(g.x,g.z,8,g.css,true));
  else{const cp=mission.cps[mission.idx];if(cp)dot(cp.x,cp.z,10,mission.gv.css,true);}
  const blink=(tG*4|0)%2;for(const c of cars)if(c.kind==='police')dot(c.x,c.z,6,blink?'#ff3355':'#4f7bff',true);
  dot(px,pz-1000,9,'#fff',true);
  {const dx=0,dz=-1000;let sx=(dx*co-dz*si),sy=(dx*si+dz*co);const L=Math.hypot(sx,sy);sx*=(MC-14)/L;sy*=(MC-14)/L;mm.fillStyle='#1d1430';mm.font='900 12px Rubik';mm.textAlign='center';mm.textBaseline='middle';mm.fillText('N',MC+sx,MC+sy+1);}
  mm.beginPath();mm.moveTo(MC,MC-11);mm.lineTo(MC+8,MC+8);mm.lineTo(MC,MC+4);mm.lineTo(MC-8,MC+8);mm.closePath();mm.fillStyle='#fff';mm.fill();mm.lineWidth=3;mm.strokeStyle='#1d1430';mm.stroke();}

/* ================= CAMERA E CEU ================= */
const CC={nT:new THREE.Color(0x0a0828),nB:new THREE.Color(0x2d1552),dT:new THREE.Color(0x3a2a80),dB:new THREE.Color(0xff8a5c),yT:new THREE.Color(0x3d8fe6),yB:new THREE.Color(0xc5e8ff),oD:new THREE.Color(0x2bb7cc),oN:new THREE.Color(0x0f2a4d)};
const tA=new THREE.Color(),tB=new THREE.Color(),sd=new THREE.Vector3();let nightF=0;
function updDay(dt){dayT=(dayT+dt/300)%1;const a=(dayT-0.25)*Math.PI*2,s=Math.sin(a);
  if(s>0.25){const k=Math.min(1,(s-0.25)/0.5);tA.copy(CC.dT).lerp(CC.yT,k);tB.copy(CC.dB).lerp(CC.yB,k);}
  else if(s>-0.2){const k=(s+0.2)/0.45;tA.copy(CC.nT).lerp(CC.dT,k);tB.copy(CC.nB).lerp(CC.dB,k);}
  else{tA.copy(CC.nT);tB.copy(CC.nB);}
  skyU.top.value.copy(tA);skyU.bot.value.copy(tB);scene.fog.color.copy(tB);
  nightF=clamp((0.12-s)/0.3,0,1);
  sd.set(Math.cos(a),s,0.3).normalize();sunL.position.copy(sd).multiplyScalar(100);sunL.intensity=clamp(s*1.5+0.15,0,1)*0.85;
  hemi.intensity=0.4+0.5*clamp(s+0.25,0,1);
  sunM.position.copy(camera.position).addScaledVector(sd,1000);sunM.visible=s>-0.15;sunM.material.color.setHSL(0.1,1,0.6+clamp(s,0,1)*0.3);
  moonM.position.copy(camera.position).addScaledVector(sd,-1000);moonM.visible=s<0.1;
  starPts.material.opacity=nightF;starPts.position.copy(camera.position);sky.position.copy(camera.position);
  for(const m of bMats)m.emissiveIntensity=nightF*0.95;
  oceanM.color.copy(CC.oD).lerp(CC.oN,nightF*0.8);
  ocean.position.y=0.06+Math.sin(tG*0.8)*0.04;foam.position.x=412+Math.sin(tG*0.8)*1.6;}
function updCamera(dt){shake=Math.max(0,shake-dt*2.5);const sx=(Math.random()-.5)*shake*0.5,sy=(Math.random()-.5)*shake*0.5;
  if(player.car){const c=player.car,ch=Math.cos(c.h),sh=Math.sin(c.h),lx=0.45,lz=-0.15;
    camera.position.set(c.x+lx*ch+lz*sh+sx,1.47+sy+Math.sin(tG*30)*Math.min(0.015,Math.abs(c.spd)*0.0004),c.z-lx*sh+lz*ch);
    if(player.lookT>0)player.lookT-=dt;else player.look*=Math.exp(-dt*2.5);
    camera.rotation.set(clamp(player.pitch,-0.5,0.35),c.h+Math.PI+player.look+c.steer*0.07,0,'YXZ');
    camera.fov=72+Math.min(18,Math.abs(c.spd)*0.35);}
  else{camera.position.set(player.x+sx,1.7+player.y+player.bobY+sy,player.z);camera.rotation.set(player.pitch,player.yaw,0,'YXZ');camera.fov=75;}
  camera.updateProjectionMatrix();}

/* ================= ENTRADA ================= */
const CTRL=[['WASD','Andar / dirigir'],['MOUSE','Olhar'],['SHIFT','Correr'],['ESPAÇO','Pular / freio de mão'],['E','Entrar / sair do carro'],['R','Trocar rádio'],['H','Buzina'],['ESC','Pausar']];
document.querySelectorAll('.ctr').forEach(el=>el.innerHTML=CTRL.map(([k,t])=>`<div><span class="k">${k}</span></div><div>${t}</div>`).join(''));
const lockPtr=()=>{try{const r=renderer.domElement.requestPointerLock();if(r&&r.catch)r.catch(()=>{});}catch(e){}};
function pause(){if(state!=='play')return;state='pause';$('pause').style.display='flex';if(document.pointerLockElement)document.exitPointerLock();if(AC)AC.suspend();}
function resume(){if(state!=='pause')return;state='play';$('pause').style.display='none';lockPtr();if(AC)AC.resume();clock.getDelta();}
addEventListener('keydown',e=>{
  if(e.code==='Escape'){if(state==='pause')resume();else pause();return;}
  if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault();
  if(e.repeat)return;keys[e.code]=true;if(state!=='play')return;
  if(e.code==='KeyE')toggleCar();
  if(e.code==='KeyR'&&player.car)nextStation();
  if(e.code==='KeyH'){sfx('horn');const [px,pz]=ppos();for(const p of peds)if(Math.hypot(p.x-px,p.z-pz)<18&&p.hy<=0)p.hv=5;}});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;pause();});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;if(!locked&&state==='play')pause();});
addEventListener('mousemove',e=>{if(state!=='play'||!locked)return;const s=0.0022;
  if(player.car){player.look=clamp(player.look-e.movementX*s,-1.7,1.7);player.lookT=0.7;}else player.yaw-=e.movementX*s;
  player.pitch=clamp(player.pitch-e.movementY*s,-1.4,1.4);});
renderer.domElement.addEventListener('click',()=>{if(state==='play'&&!locked)lockPtr();});
$('play').onclick=()=>{initAudio();$('title').style.display='none';$('hud').style.display='block';state='play';lockPtr();renderStars();
  $('fv').textContent='0/12';toast('Vá até o carro rosa e aperte E');};
$('cont').onclick=resume;

/* ================= LOOP ================= */
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(0.05,clock.getDelta());
  if(state==='pause'){renderer.render(scene,camera);return;}
  tG+=dt;crashCD-=dt;promptMsg='';
  if(state==='play'){if(player.car)driveInput(dt);else updFoot(dt);}
  for(const c of cars){if(c.kind==='traffic')updTraffic(c,dt);else if(c.kind==='police')updPolice(c,dt);}
  for(const p of peds)updPed(p,dt);
  carCollisions();
  if(state==='play'){updWanted(dt);updMission(dt);updFitas(dt);}
  for(const c of cars){c.g.position.set(c.x,0,c.z);c.g.rotation.y=c.h;}
  for(const p of peds)p.g.position.set(p.x,p.hy+Math.abs(Math.sin(tG*7+p.s))*0.06,p.z);
  const bl=(tG*4|0)%2;mRed.color.setHex(bl?0xff2040:0x400010);mBlue.color.setHex(bl?0x101840:0x3060ff);
  if(state==='title'){const a=tG*0.05;camera.position.set(Math.cos(a)*300+60,105,Math.sin(a)*300);camera.lookAt(60,10,0);camera.fov=60;camera.updateProjectionMatrix();}
  else updCamera(dt);
  updDay(dt);
  if(state==='play')updHud(dt);
  updAudio();
  renderer.render(scene,camera);}
loop();
</script>
